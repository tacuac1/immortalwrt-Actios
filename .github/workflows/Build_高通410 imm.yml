#
#

name: 🚀 Build_imm_高通410系列

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean
      profile:
        description: ' ↓ 支持多款型号 手动选择要编译的机型 ↓ '
        type: choice
        options:
          - ufi003
          - ufi001c
          - ufi001b
          - ufi103s
          - jz02v10
          - qrzl903
          - w001
          - uz801
          - mf32
          - mf601
          - wf2
          - sp970v11
          - sp970v10
        default: ufi003
        required: true
      upstream:
        description: ' ↓ 选择上游源码仓库 ↓ '
        type: choice
        options:
          - lkiuyu/immortalwrt
        default: lkiuyu/immortalwrt
        required: true
      custom_hash:
        description: ' ↓ 指定 hash（默认不用填写）↓ '
        required: false
        default: ''
        type: string
      extra_packages:
        description: ' ↓ 输入额外包名（逗号或空格分隔，留空则不添加任何额外包）↓ '
        required: false
        default: ''
        type: string

env:
  REPO_URL: https://github.com/${{ github.event.inputs.upstream }}
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ format('config/{0}.config', github.event.inputs.profile) }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - name: 🚀 编译 (Build)
      uses: actions/checkout@main

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh
  
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        docker-images: false
        swap-storage: true
        
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)

    - name: mkbootimg build
      run: |
        wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb
        sudo apt-get install -f -y
        # 验证安装
        mkbootimg --help || true
        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
        echo "mkbootimg found at: $MKBOOTIMG_PATH"
        file "$MKBOOTIMG_PATH"
        else
        echo "❌ mkbootimg not found in PATH!"
        fi

        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT
        
    - name: Ensure Python build tools
      run: |
       python3 -m pip cache purge
       python3 -m pip install --upgrade --force-reinstall pip
       python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
       python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
       python3 -m pip install --upgrade cython packaging tomli
       python3 -m pip install Unidecode pyelftools
       python3 -m pip --version
       python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"



    - name: 读取锁定的上游 hash (Read locked upstream hash)
      id: lock
      run: |
        CUSTOM_HASH="${{ github.event.inputs.custom_hash }}"
        LOCK_FILE="upstream_lock.txt"
        if [ -n "$CUSTOM_HASH" ]; then
          echo "locked_hash=$CUSTOM_HASH" >> $GITHUB_OUTPUT
          echo "使用用户指定 hash: $CUSTOM_HASH"
        elif [ -f "$LOCK_FILE" ]; then
          HASH=$(cat $LOCK_FILE)
          echo "locked_hash=$HASH" >> $GITHUB_OUTPUT
          echo "使用锁定 hash: $HASH"
        else
          echo "locked_hash=" >> $GITHUB_OUTPUT
          echo "upstream_lock.txt 不存在，使用最新 master"
        fi

    - name: Configure Git
      run: git config --global http.postBuffer 524288000

    - name: Clone source code
      working-directory: /mnt
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        if [ -n "${{ steps.lock.outputs.locked_hash }}" ]; then
          cd openwrt && git checkout ${{ steps.lock.outputs.locked_hash }}
        fi
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt


    - name:  files
      run: cp -r files openwrt/files

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Remove conflicting packages from smpackage
      run: |
        # 删除 small-package 中与系统冲突的包，避免编译报错（官方推荐操作）
        rm -rf openwrt/feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a -f

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Enable IPv4 policy routing
      run: |
        cd openwrt

        echo "=========================================="
        echo "Enable IPv4 policy routing for UFI103S"
        echo "=========================================="

        KERNEL_CONFIG="target/linux/generic/config-6.12"

        if [ ! -f "$KERNEL_CONFIG" ]; then
          echo "ERROR: $KERNEL_CONFIG not found!"
          exit 1
        fi

        echo "Using kernel config: $KERNEL_CONFIG"

        # Remove old/conflicting values first.
        sed -i '/^CONFIG_IP_ADVANCED_ROUTER=/d' "$KERNEL_CONFIG"
        sed -i '/^# CONFIG_IP_ADVANCED_ROUTER is not set$/d' "$KERNEL_CONFIG"
        sed -i '/^CONFIG_IP_MULTIPLE_TABLES=/d' "$KERNEL_CONFIG"
        sed -i '/^# CONFIG_IP_MULTIPLE_TABLES is not set$/d' "$KERNEL_CONFIG"

        # Enable IPv4 advanced routing and multiple routing tables.
        echo 'CONFIG_IP_ADVANCED_ROUTER=y' >> "$KERNEL_CONFIG"
        echo 'CONFIG_IP_MULTIPLE_TABLES=y' >> "$KERNEL_CONFIG"

        echo "Kernel policy routing configuration:"
        grep -E '^CONFIG_IP_(ADVANCED_ROUTER|MULTIPLE_TABLES)=' "$KERNEL_CONFIG"

        test "$(grep -c '^CONFIG_IP_ADVANCED_ROUTER=y$' "$KERNEL_CONFIG")" -eq 1
        test "$(grep -c '^CONFIG_IP_MULTIPLE_TABLES=y$' "$KERNEL_CONFIG")" -eq 1

    - name: Install extra packages
      if: ${{ inputs.extra_packages != '' }}
      run: |
        cd openwrt
        echo "=========================================="
        echo "User requested extra packages:"
        echo "${{ inputs.extra_packages }}"
        echo "=========================================="

        # 提取系统设置参数（__ip__ 和 __hostname__ 前缀）
        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)

        # 应用自定义 IP
        if [ -n "$CUSTOM_IP" ]; then
          echo "🌐 设置管理 IP: $CUSTOM_IP"
          sed -i "s/192\.168\.1\.1/$CUSTOM_IP/g" package/base-files/files/bin/config_generate
        fi

        # 应用自定义主机名
        if [ -n "$CUSTOM_HOSTNAME" ]; then
          echo "🏷️ 设置主机名: $CUSTOM_HOSTNAME"
          sed -i "s/set system\.@system\[0\]\.hostname='ImmortalWrt'/set system.@system[0].hostname='$CUSTOM_HOSTNAME'/" package/base-files/files/bin/config_generate || true
          sed -i "s/option hostname 'ImmortalWrt'/option hostname '$CUSTOM_HOSTNAME'/" package/base-files/files/etc/config/system 2>/dev/null || true
        fi

        # 过滤掉特殊前缀，只处理真正的包名
        PACKAGES=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | tr '\n' ' ')

        # 检测是否选了 turboacc，如果选了则先执行安装脚本
        if echo "$PACKAGES" | grep -qw "luci-app-turboacc"; then
          echo "⚡ 检测到 luci-app-turboacc，执行 turboacc 安装脚本..."
          curl -sSL https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh -o add_turboacc.sh && bash add_turboacc.sh || echo "⚠️ turboacc 脚本执行失败，跳过"
        fi

        for pkg in $PACKAGES; do
          if [ -n "$pkg" ]; then
            CFG="CONFIG_PACKAGE_${pkg}"
            if grep -q "^# ${CFG} is not set" .config; then
              sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
              echo "✅ Enabled (replaced): ${CFG}=y"
            elif grep -q "^${CFG}=" .config; then
              sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
              echo "✅ Enabled (updated): ${CFG}=y"
            else
              echo "${CFG}=y" >> .config
              echo "✅ Enabled (appended): ${CFG}=y"
            fi
          fi
        done
        
        
    - name: Add UFI103S LuCI modem and proxy UI
      if: ${{ inputs.profile == 'ufi103s' }}
      run: |
        cd openwrt
        echo "=========================================="
        echo "Add UFI103S modem/proxy LuCI integration"
        echo "=========================================="

        # 1) Native ModemManager protocol UI. Current LuCI exposes
        #    allowedmode/preferredmode through the ModemManager protocol.
        #    Keep it in the image so the existing modem interface remains editable.
        for pkg in luci-proto-modemmanager; do
          CFG="CONFIG_PACKAGE_${pkg}"
          if grep -q "^# ${CFG} is not set$" .config; then
            sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
          elif grep -q "^${CFG}=" .config; then
            sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
          else
            echo "${CFG}=y" >> .config
          fi
        done

        # 2) Use the official ImmortalWrt HomeProxy LuCI application instead of
        #    luci-app-singbox-ui. HomeProxy is a sing-box client for OpenWrt and
        #    supports VLESS/VMess, node/subscription management and transparent
        #    proxy modes. Avoid the broken third-party codeload URL entirely.
        rm -rf package/luci-app-homeproxy /tmp/homeproxy
        export GIT_TERMINAL_PROMPT=0
        for n in 1 2 3; do
          rm -rf /tmp/homeproxy
          if git -c credential.helper= -c core.askPass= clone --depth 1 --single-branch \
            https://github.com/immortalwrt/homeproxy.git /tmp/homeproxy; then
            break
          fi
          echo "HomeProxy clone failed (attempt $n/3)"
          sleep 5
        done
        [ -f /tmp/homeproxy/Makefile ] || {
          echo "ERROR: ImmortalWrt HomeProxy clone failed after 3 attempts"
          exit 1
        }
        cp -a /tmp/homeproxy package/luci-app-homeproxy
        # HomeProxy only needs the sing-box executable; use the existing tiny
        # variant already built for this Snapdragon 410 device.
        sed -i 's/+sing-box/+sing-box-tiny/' package/luci-app-homeproxy/Makefile
        echo "HomeProxy package detected at package/luci-app-homeproxy"
        rm -rf /tmp/homeproxy

        # 3) Small UFI103S-specific modem page. It deliberately uses only fixed
        #    ModemManager values: no arbitrary shell command is accepted from LuCI.
        mkdir -p package/ufi103s-modem/{root/usr/share/luci/menu.d,root/usr/lib/lua/luci/model/cbi/ufi103s,root/etc/uci-defaults}
        cat > package/ufi103s-modem/Makefile <<'EOF'
        include $(TOPDIR)/rules.mk
        PKG_NAME:=ufi103s-modem
        PKG_RELEASE:=1
        include $(INCLUDE_DIR)/package.mk
        define Package/ufi103s-modem
          SECTION:=luci
          CATEGORY:=LuCI
          TITLE:=UFI103S Modem controls
          DEPENDS:=+modemmanager +luci-base
        endef
        define Package/ufi103s-modem/install
          $(CP) ./root/* $(1)/
        endef
        $(eval $(call BuildPackage,ufi103s-modem))
        EOF

        cat > package/ufi103s-modem/root/usr/share/luci/menu.d/ufi103s.json <<'EOF'
        {
          "admin/modem/ufi103s": {
            "title": "UFI103S 4G Modem",
            "order": 10,
            "action": { "type": "cbi", "path": "ufi103s/modem" },
            "depends": { "acl": ["luci-base"] }
          }
        }
        EOF

        cat > package/ufi103s-modem/root/etc/uci-defaults/99-ufi103s-modem <<'EOF'
        # Keep the UFI103S connection on LTE + IPv4 by default.
        uci -q set network.modem.allowedmode='4g'
        uci -q set network.modem.preferredmode='4g'
        uci -q set network.modem.iptype='ipv4'
        uci -q set network.modem.apn='m-wap'
        uci -q commit network
        /etc/init.d/ufi103s-proxy-watch enable 2>/dev/null || true
        exit 0
        EOF

        cat > package/ufi103s-modem/root/usr/lib/lua/luci/model/cbi/ufi103s/modem.lua <<'EOF'
        local fs = require "nixio.fs"
        local http = require "luci.http"
        local uci = require "luci.model.uci".cursor()

        local function sh(cmd)
          return luci.sys.exec(cmd) or ""
        end

        local function modem_id()
          local s = sh("mmcli -L 2>/dev/null")
          return s:match("/Modem/(%d+)")
        end

        local mid = modem_id()
        local m = SimpleForm("ufi103s_modem", translate("UFI103S 4G Modem"),
          translate("LTE/3G mode and LTE band controls for the built-in UFI103S modem."))
        m.reset = false
        m.submit = true

        local status = m:section(SimpleSection, nil)
        local info = mid and sh("mmcli -m " .. mid .. " 2>/dev/null") or "ModemManager: no modem detected"
        local state = info:match("state:%s*([^\n]+)") or "unknown"
        local tech = info:match("access tech:%s*([^\n]+)") or "unknown"
        local sig = info:match("signal quality:%s*([^\n]+)") or "unknown"
        local op = info:match("operator name:%s*([^\n]+)") or "unknown"
        local pkt = info:match("packet service state:%s*([^\n]+)") or "unknown"
        status:option(DummyValue, "status", translate("Status")).value = state
        status:option(DummyValue, "technology", translate("Access technology")).value = tech
        status:option(DummyValue, "signal", translate("Signal")).value = sig
        status:option(DummyValue, "operator", translate("Operator")).value = op
        status:option(DummyValue, "packet", translate("Packet service")).value = pkt

        local s = m:section(SimpleSection, nil, translate("Network mode"))
        local mode = s:option(ListValue, "allowedmode", translate("Allowed mode"))
        mode:value("4g", "4G LTE")
        mode:value("3g", "3G")
        mode:value("3g|4g", "3G + 4G")
        mode:value("2g|3g|4g", "Auto (2G/3G/4G)")
        mode.default = uci:get("network", "modem", "allowedmode") or "4g"
        mode.write = function(self, section, value)
          uci:set("network", "modem", "allowedmode", value)
          uci:set("network", "modem", "preferredmode", value == "3g|4g" and "4g" or (value == "2g|3g|4g" and "4g" or value))
          uci:commit("network")
          if mid then
            sh("mmcli -m " .. mid .. " --set-allowed-modes='" .. value .. "' >/dev/null 2>&1")
            if value ~= "2g|3g|4g" then
              sh("mmcli -m " .. mid .. " --set-preferred-mode='" .. (value == "3g|4g" and "4g" or value) .. "' >/dev/null 2>&1")
            end
          end
        end

        local ip = s:option(ListValue, "iptype", translate("IP type"))
        ip:value("ipv4", "IPv4")
        ip:value("ipv4v6", "IPv4 + IPv6")
        ip:value("ipv6", "IPv6")
        ip.default = uci:get("network", "modem", "iptype") or "ipv4"
        ip.write = function(self, section, value)
          uci:set("network", "modem", "iptype", value)
          uci:commit("network")
        end

        local b = m:section(SimpleSection, nil, translate("LTE bands"))
        b:option(DummyValue, "supported", translate("Supported LTE bands")).value = "B1, B3, B5 (from this UFI103S modem)"
        local bands = b:option(MultiValue, "bands", translate("LTE band lock"), translate("Leave all unchecked for automatic band selection."))
        bands.widget = "checkbox"
        bands:value("eutran-1", "B1")
        bands:value("eutran-3", "B3")
        bands:value("eutran-5", "B5")
        bands.cfgvalue = function(self, section)
          return uci:get("network", "modem", "bands") or ""
        end
        bands.write = function(self, section, value)
          local list = type(value) == "table" and table.concat(value, "|") or value
          uci:set("network", "modem", "allowedmode", uci:get("network", "modem", "allowedmode") or "4g")
          if list == "" then
            uci:delete("network", "modem", "bands")
            if mid then sh("mmcli -m " .. mid .. " --set-current-bands='any' >/dev/null 2>&1") end
          else
            uci:set("network", "modem", "bands", list)
            if mid then sh("mmcli -m " .. mid .. " --set-current-bands='" .. list .. "' >/dev/null 2>&1") end
          end
          uci:commit("network")
        end

        local note = m:section(SimpleSection)
        note:option(DummyValue, "note", translate("Note")).value = translate("Band locking can temporarily disconnect LTE while the modem reselects a cell.")
        return m
        EOF

        # Correct the Lua dependency name if the source tree uses nixio.fs differently;
        # the model itself does not depend on arbitrary filesystem access.

        # 4) Auto-restart helper: if sing-box is already running and wwan0
        #    transitions from no IPv4 to IPv4, restart sing-box once so its TUN/
        #    routing state is rebuilt after a 4G reconnect. It never starts the
        #    proxy by itself and never changes the modem mode/APN.
        mkdir -p package/ufi103s-proxy/root/{etc/init.d,usr/sbin}
        cat > package/ufi103s-proxy/Makefile <<'EOF'
        include $(TOPDIR)/rules.mk
        PKG_NAME:=ufi103s-proxy
        PKG_RELEASE:=1
        include $(INCLUDE_DIR)/package.mk
        define Package/ufi103s-proxy
          SECTION:=net
          CATEGORY:=Network
          TITLE:=UFI103S sing-box WAN recovery helper
          DEPENDS:=+sing-box-tiny
        endef
        define Package/ufi103s-proxy/install
          $(CP) ./root/* $(1)/
        endef
        $(eval $(call BuildPackage,ufi103s-proxy))
        EOF

        cat > package/ufi103s-proxy/root/etc/init.d/ufi103s-proxy-watch <<'EOF'
        #!/bin/sh /etc/rc.common
        START=98
        STOP=10
        USE_PROCD=1
        
        start_service() {
          procd_open_instance
          procd_set_param command /usr/sbin/ufi103s-proxy-watch
          procd_set_param respawn 3600 5 0
          procd_close_instance
        }
        EOF
        chmod 0755 package/ufi103s-proxy/root/etc/init.d/ufi103s-proxy-watch

        cat > package/ufi103s-proxy/root/usr/sbin/ufi103s-proxy-watch <<'EOF'
        #!/bin/sh
        STATE=/tmp/ufi103s_proxy_wan_state
        OLD=0
        [ -r "$STATE" ] && OLD=$(cat "$STATE" 2>/dev/null || echo 0)
        while :; do
          NEW=0
          if ip link show wwan0 >/dev/null 2>&1 && ip -4 addr show dev wwan0 | grep -q 'inet '; then
            NEW=1
          fi
          if [ "$OLD" = 0 ] && [ "$NEW" = 1 ] && pidof sing-box >/dev/null 2>&1; then
            if [ -x /etc/init.d/homeproxy ]; then
              /etc/init.d/homeproxy restart >/dev/null 2>&1 || true
            elif [ -x /etc/init.d/sing-box ]; then
              /etc/init.d/sing-box restart >/dev/null 2>&1 || true
            elif [ -x /etc/init.d/singbox ]; then
              /etc/init.d/singbox restart >/dev/null 2>&1 || true
            fi
          fi
          OLD=$NEW
          echo "$OLD" > "$STATE"
          sleep 10
        done
        EOF
        chmod 0755 package/ufi103s-proxy/root/usr/sbin/ufi103s-proxy-watch

        for pkg in luci-app-homeproxy luci-i18n-homeproxy-zh-cn ufi103s-modem ufi103s-proxy; do
          CFG="CONFIG_PACKAGE_${pkg}"
          if grep -q "^# ${CFG} is not set$" .config; then
            sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
          elif grep -q "^${CFG}=" .config; then
            sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
          else
            echo "${CFG}=y" >> .config
          fi
        done

        echo "UFI103S UI packages enabled:"
        grep -E '^CONFIG_PACKAGE_(luci-proto-modemmanager|luci-app-homeproxy|ufi103s-modem|ufi103s-proxy)=' .config || true

    - name: Ensure transparent proxy packages
      if: ${{ inputs.profile == 'ufi103s' }}
      run: |
        cd openwrt

        echo "=========================================="
        echo "Ensure UFI103S transparent proxy packages"
        echo "=========================================="

        for pkg in           sing-box-tiny           kmod-tun           kmod-nft-tproxy           kmod-nft-socket           kmod-wireguard           wireguard-tools           luci-proto-wireguard
        do
          CFG="CONFIG_PACKAGE_${pkg}"
          if grep -q "^# ${CFG} is not set$" .config; then
            sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
          elif grep -q "^${CFG}=" .config; then
            sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
          else
            echo "${CFG}=y" >> .config
          fi
        done

        echo "Required UFI103S packages before defconfig:"
        grep -E '^CONFIG_PACKAGE_(sing-box-tiny|kmod-tun|kmod-nft-tproxy|kmod-nft-socket|kmod-wireguard|wireguard-tools|luci-proto-wireguard)=' .config || true

    - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
      uses: mxschmitt/action-tmate@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}
      
      
    - name: Config defconfig
      id: config
      run: |
        cd openwrt

        echo "=========================================="
        echo "Running OpenWrt defconfig"
        echo "=========================================="

        make defconfig

        echo "=========================================="
        echo "Checking final OpenWrt configuration"
        echo "=========================================="

        echo "--- Target device ---"
        grep -E '^CONFIG_TARGET.*DEVICE.*=y' .config || {
          echo "ERROR: target device is missing!"
          exit 1
        }

        echo "--- sing-box ---"
        grep -E '^CONFIG_PACKAGE_sing-box(-tiny)?=' .config || true

        if [ "${{ inputs.profile }}" = "ufi103s" ]; then
          grep -q '^CONFIG_PACKAGE_sing-box-tiny=y$' .config || {
            echo "ERROR: sing-box-tiny is missing from final .config!"
            exit 1
          }
          for pkg in luci-proto-modemmanager luci-app-homeproxy ufi103s-modem ufi103s-proxy; do
            grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config || {
              echo "ERROR: ${pkg} is missing from final .config!"
              exit 1
            }
          done
        fi

        echo "--- Kernel config fragment ---"
        KERNEL_CONFIG="target/linux/generic/config-6.12"

        if [ ! -f "$KERNEL_CONFIG" ]; then
          echo "ERROR: $KERNEL_CONFIG not found!"
          exit 1
        fi

        grep -E '^CONFIG_IP_(ADVANCED_ROUTER|MULTIPLE_TABLES)=' "$KERNEL_CONFIG" || {
          echo "ERROR: IPv4 policy routing options are missing!"
          exit 1
        }

        test "$(grep -c '^CONFIG_IP_ADVANCED_ROUTER=y$' "$KERNEL_CONFIG")" -eq 1 || {
          echo "ERROR: CONFIG_IP_ADVANCED_ROUTER is not exactly y!"
          exit 1
        }

        test "$(grep -c '^CONFIG_IP_MULTIPLE_TABLES=y$' "$KERNEL_CONFIG")" -eq 1 || {
          echo "ERROR: CONFIG_IP_MULTIPLE_TABLES is not exactly y!"
          exit 1
        }

        echo "=========================================="
        echo "Final IPv4 policy routing options:"
        echo "=========================================="
        grep -E '^CONFIG_IP_(ADVANCED_ROUTER|MULTIPLE_TABLES)=' "$KERNEL_CONFIG"

        echo "=========================================="
        echo "Configuration check completed successfully"
        echo "=========================================="
       
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j4 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 查看 openwrt 目录
      run: ls -la openwrt/
      
           ls -l .config
      
           ls -la openwrt/.config

 
    - name: 自动上传最新源码生成.config编译配置
      uses: actions/upload-artifact@main
      with:
       name: build-config
       path: |
         ${{ github.workspace }}/openwrt/.config
         ${{ github.workspace }}/openwrt/feeds.conf.default
       include-hidden-files: true


    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Get kernel version
      run: |
        KERNEL_VER=$(cat /mnt/openwrt/build_dir/target-*/linux-*/linux-*/.kernelversion 2>/dev/null | head -1 || echo "未知")
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV


    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        PROFILE=${{ github.event.inputs.profile }}

        # 创建刷机包目录并打包 zip
        mkdir -p flash_package
        BOOT_IMG=$(ls *boot.img.gz *boot.img 2>/dev/null | head -1)
        SYSTEM_IMG=$(ls *system.img.gz *system.img 2>/dev/null | head -1)
        if [ -z "$BOOT_IMG" ] || [ -z "$SYSTEM_IMG" ]; then
          echo "::error::固件文件未找到，编译可能失败！当前目录文件："
          ls -la
          exit 1
        fi
        cp "$BOOT_IMG" flash_package/boot.img.gz
        cp "$SYSTEM_IMG" flash_package/system.img.gz
        # 解压供刷机脚本使用
        gzip -dk flash_package/boot.img.gz
        gzip -dk flash_package/system.img.gz
        rm flash_package/boot.img.gz flash_package/system.img.gz
        cp -r $GITHUB_WORKSPACE/刷机脚本/. flash_package/
        # 确保 bat 文件是 CRLF 换行（Windows 兼容）
        if command -v unix2dos >/dev/null 2>&1; then
          unix2dos flash_package/*.bat
        else
          sed -i 's/\r$//' flash_package/*.bat
          sed -i 's/$/\r/' flash_package/*.bat
        fi
        ZIP_NAME="OpenWrt_${PROFILE}${{ env.FILE_DATE }}_刷机包.zip"
        cd flash_package && zip -r "../$ZIP_NAME" . && cd ..

        # 整理 release 目录：zip + 单独固件 + 编译信息
        mkdir -p release_files
        mv "$ZIP_NAME" release_files/
        cp *.manifest release_files/ 2>/dev/null || true
        cp *.buildinfo release_files/ 2>/dev/null || true
        cp sha256sums release_files/ 2>/dev/null || true

        echo "FIRMWARE=$PWD/release_files" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        PROFILE=${{ github.event.inputs.profile }}
        # 提取用户设置的 IP 和主机名
        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)
        DISPLAY_IP=${CUSTOM_IP:-192.168.1.1}
        DISPLAY_HOSTNAME=${CUSTOM_HOSTNAME:-ImmortalWrt}
        # 过滤掉特殊前缀，只显示真正的包名
        EXTRA=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | sed '/^$/d')

        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${PROFILE}" >> $GITHUB_OUTPUT
        touch release.txt
        {
          echo "## Immortalwrt master分支 高通410系列 · ${PROFILE}"
          echo ""
          echo "| 项目 | 信息 |"
          echo "|------|------|"
          echo "| 编译者 | ${{ github.actor }} |"
          echo "| 机型 | ${PROFILE} |"
          echo "| 内核版本 | ${{ env.KERNEL_VER }} |"
          echo "| 管理地址 | ${DISPLAY_IP} |"
          echo "| 主机名 | ${DISPLAY_HOSTNAME} |"
          echo "| 默认用户 | root |"
          echo "| 默认密码 | 空 |"
          echo ""
          if [ -n "$EXTRA" ]; then
            echo "### 额外添加的包"
            echo "$EXTRA" | sed 's/^/- /'
          else
            echo "### 额外添加的包"
            echo "无"
          fi
        } >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT



    - name: Generate file list
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        find ${{ env.FIRMWARE }} -type f > file_list.txt
        echo "Collected files:"
        cat file_list.txt
        test -s file_list.txt || { echo "::error::No firmware files found"; exit 1; }



    - name: Upload firmware to release
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false

    - name: Delete old workflow runs via GitHub API
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 7
        KEEP_MINIMUM_RUNS: 5
      run: |
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((now - (.created_at | fromdateiso8601)) > ($cutoff | tonumber))
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [[ -z "$DEL_IDS" ]]; then
          echo "No old runs to delete."
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "Deleting run $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
        fi
