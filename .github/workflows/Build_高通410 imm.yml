name: Build ImmortalWrt UFI-001C LuCI Minimal

on:
  workflow_dispatch:
    inputs:
      custom_hash:
        description: "ImmortalWrt commit hash; blank = latest master"
        required: false
        default: ""
        type: string
      wifi_ssid:
        description: "Wi-Fi SSID used to open LuCI"
        required: false
        default: "UFI-001C-Router"
        type: string
      wifi_password:
        description: "Wi-Fi password; leave blank for an open network"
        required: false
        default: ""
        type: string
      root_password:
        description: "LuCI root password; 8-63 safe ASCII characters"
        required: false
        default: "phuong3006"
        type: string

env:
  REPO_URL: https://github.com/lkiuyu/immortalwrt.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai
  FIRMWARE_VERSION: v3.1.0
  PASSWALL_LUCI_URL: https://github.com/Openwrt-Passwall/openwrt-passwall.git
  PASSWALL_PACKAGES_URL: https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git

jobs:
  build:
    name: Build UFI-001C LuCI minimal firmware
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    env:
      CUSTOM_HASH: ${{ inputs.custom_hash }}
      WIFI_SSID: ${{ inputs.wifi_ssid }}
      WIFI_PASSWORD: ${{ inputs.wifi_password }}
      ROOT_PASSWORD: ${{ inputs.root_password }}

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 \
            python3-distutils python3-pip python3-ply python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl jq ninja-build \
            p7zip-full gettext-base xsltproc swig time libelf-dev \
            libdw-dev android-sdk-libsparse-utils mkbootimg qemu-utils \
            re2c squashfs-tools subversion texinfo zstd
          sudo ln -sf "/usr/share/zoneinfo/${TZ}" /etc/localtime
          echo "${TZ}" | sudo tee /etc/timezone
          command -v mkbootimg
          command -v img2simg

      - name: Clone ImmortalWrt
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
          if [[ -n "$CUSTOM_HASH" ]]; then
            [[ "$CUSTOM_HASH" =~ ^[0-9a-fA-F]{7,64}$ ]] || {
              echo "::error::custom_hash must be a valid Git commit hash"
              exit 1
            }
            git -C openwrt fetch --depth=1 origin "$CUSTOM_HASH"
            git -C openwrt checkout --detach "$CUSTOM_HASH"
          fi
          git -C openwrt log -1 --oneline

      - name: Restore libffi package if required by this source snapshot
        working-directory: openwrt
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f package/libs/libffi/Makefile ]]; then
            mkdir -p package/libs/libffi
            curl --fail --show-error --location --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/openwrt/openwrt/9b835ec626/package/libs/libffi/Makefile" \
              --output package/libs/libffi/Makefile
          fi
          test -s package/libs/libffi/Makefile

      - name: Update and install standard feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: Add HandsomeMod adbd feed
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^src-git handsomefeed ' feeds.conf.default || \
            printf '%s\n' 'src-git handsomefeed https://github.com/HandsomeMod/handsomefeed.git' >> feeds.conf.default
          ./scripts/feeds update handsomefeed
          # Do not install the whole legacy feed: its graphics packages
          # (kmscube/weston) are incompatible with the current source tree.
          ADB_SOURCE_MAKEFILE="$(find -L feeds/handsomefeed -type f -name Makefile -print0 \
            | xargs -0 grep -l '^PKG_NAME:=android-tools$' \
            | head -n 1)"
          test -n "$ADB_SOURCE_MAKEFILE"
          rm -rf package/utils/android-tools
          mkdir -p package/utils
          cp -a "$(dirname "$ADB_SOURCE_MAKEFILE")" package/utils/android-tools
          ADB_MAKEFILE=package/utils/android-tools/Makefile
          # The feed uses the old package name; current OpenWrt calls it
          # kmod-usb-gadget-fs (USB FunctionFS support).
          sed -i 's/kmod-usb-gadget-functionfs/kmod-usb-gadget-fs/g' "$ADB_MAKEFILE"
          test -f "$ADB_MAKEFILE"

      - name: Add PassWall and Xray feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^src-git passwall_luci ' feeds.conf.default || \
            printf 'src-git passwall_luci %s;main\n' "$PASSWALL_LUCI_URL" >> feeds.conf.default
          grep -q '^src-git passwall_packages ' feeds.conf.default || \
            printf 'src-git passwall_packages %s;main\n' "$PASSWALL_PACKAGES_URL" >> feeds.conf.default
          ./scripts/feeds update passwall_luci passwall_packages
          PASSWALL_LUCI_DIR="$(dirname "$(find -L feeds/passwall_luci -type f \
            -path '*/luci-app-passwall/Makefile' -print -quit)")"
          XRAY_DIR="$(dirname "$(find -L feeds/passwall_packages -type f \
            -path '*/xray-core/Makefile' -print -quit)")"
          test -f "$PASSWALL_LUCI_DIR/Makefile"
          test -f "$XRAY_DIR/Makefile"
          rm -rf package/passwall/luci-app-passwall package/passwall/xray-core
          mkdir -p package/passwall
          cp -a "$PASSWALL_LUCI_DIR" package/passwall/luci-app-passwall
          cp -a "$XRAY_DIR" package/passwall/xray-core

      - name: Configure UFI-001C, LuCI and USB ADB
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          [[ "$WIFI_SSID" =~ ^[A-Za-z0-9._\ -]{1,32}$ ]] || {
            echo "::error::wifi_ssid must contain 1-32 safe ASCII characters"
            exit 1
          }
          [[ -z "$WIFI_PASSWORD" || "$WIFI_PASSWORD" =~ ^[A-Za-z0-9._@#%+\-]{8,63}$ ]] || {
            echo "::error::wifi_password must be blank or contain 8-63 safe ASCII characters"
            exit 1
          }
          [[ "$ROOT_PASSWORD" =~ ^[A-Za-z0-9._@#%+\-]{8,63}$ ]] || {
            echo "::error::root_password must contain 8-63 safe ASCII characters"
            exit 1
          }

          cat > .config <<'EOF'
          CONFIG_TARGET_msm89xx=y
          CONFIG_TARGET_msm89xx_msm8916=y
          CONFIG_TARGET_DEVICE_msm89xx_msm8916_DEVICE_openstick-ufi001c=y

          # LuCI web interface and minimum HTTP/UBUS dependencies.
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-ucode=y
          CONFIG_PACKAGE_wpad-basic-wolfssl=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y

          # ADB over the device USB port.
          CONFIG_PACKAGE_android-tools-adbd=y
          CONFIG_PACKAGE_kmod-usb-gadget=y
          CONFIG_PACKAGE_kmod-usb-lib-composite=y
          CONFIG_PACKAGE_kmod-usb-gadget-fs=y
          CONFIG_PACKAGE_kmod-fs-configfs=y
          # ADB uses FunctionFS only; disable Ethernet/RNDIS variants that
          # require u_ether.ko and break kmod-usb-gadget-fs packaging.
          CONFIG_USB_FUNCTIONFS_ETH=n
          CONFIG_USB_FUNCTIONFS_RNDIS=n

          # PassWall/Xray support for creating a VMess server in LuCI.
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=n

          # Exclude unrelated services and add-on functions.
          CONFIG_PACKAGE_luci-app-ttyd=n
          CONFIG_PACKAGE_ttyd=n
          CONFIG_PACKAGE_dropbear=n
          CONFIG_PACKAGE_relayd=n
          CONFIG_PACKAGE_luci-proto-relay=n
          CONFIG_PACKAGE_modemmanager=n
          CONFIG_PACKAGE_qmi-utils=n
          CONFIG_PACKAGE_uqmi=n
          CONFIG_PACKAGE_kmod-usb-net-rndis=n
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=n
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=n
          EOF

          printf 'CONFIG_TARGET_ROOTFS_PWD="%s"\n' "$ROOT_PASSWORD" >> .config
          make defconfig

          grep -qx 'CONFIG_TARGET_msm89xx=y' .config
          grep -qx 'CONFIG_TARGET_msm89xx_msm8916=y' .config
          grep -qx 'CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-ufi001c=y' .config
          grep -q '^CONFIG_PACKAGE_luci=y$' .config
          grep -q '^CONFIG_PACKAGE_uhttpd=y$' .config
          grep -q '^CONFIG_PACKAGE_uhttpd-mod-ubus=y$' .config
          grep -q '^CONFIG_PACKAGE_android-tools-adbd=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-usb-gadget-fs=y$' .config
          grep -q '^CONFIG_USB_FUNCTIONFS_ETH=n$' .config
          grep -q '^CONFIG_USB_FUNCTIONFS_RNDIS=n$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y$' .config
          grep -q '^CONFIG_PACKAGE_xray-core=y$' .config

          mkdir -p files/etc/uci-defaults files/etc/init.d

          # Replace the feed init script with a small configfs gadget that
          # exposes only FunctionFS ADB on the UFI-001C USB device port.
          cat > files/etc/init.d/adbd <<'EOF'
          #!/bin/sh /etc/rc.common
          START=80
          STOP=99
          USE_PROCD=1

          GADGET=/sys/kernel/config/usb_gadget/ufi001c
          FFS=/dev/usb-ffs/adb

          start_service() {
              modprobe usb_f_fs 2>/dev/null || true
              modprobe libcomposite 2>/dev/null || true
              mkdir -p /sys/kernel/config /dev/usb-ffs/adb
              mountpoint -q /sys/kernel/config || mount -t configfs configfs /sys/kernel/config
              mountpoint -q "$FFS" || mount -t functionfs adb "$FFS"

              procd_open_instance
              procd_set_param command /usr/bin/adbd -D
              procd_set_param respawn
              procd_close_instance

              i=0
              while [ ! -e "$FFS/ep0" ] && [ "$i" -lt 10 ]; do
                  sleep 1
                  i=$((i + 1))
              done
              [ -e "$FFS/ep0" ] || return 0

              mkdir -p "$GADGET/strings/0x409" "$GADGET/configs/c.1/strings/0x409" "$GADGET/functions/ffs.adb"
              echo 0x18d1 > "$GADGET/idVendor"
              echo 0x4ee7 > "$GADGET/idProduct"
              echo UFI001C > "$GADGET/strings/0x409/serialnumber"
              echo UFI-001C > "$GADGET/strings/0x409/manufacturer"
              echo 'ImmortalWrt UFI-001C ADB' > "$GADGET/strings/0x409/product"
              echo 0x80 > "$GADGET/configs/c.1/bmAttributes"
              echo 500 > "$GADGET/configs/c.1/MaxPower"
              ln -sf "$GADGET/functions/ffs.adb" "$GADGET/configs/c.1/ffs.adb"

              for udc in /sys/class/udc/*; do
                  [ -e "$udc" ] || continue
                  echo "$(basename "$udc")" > "$GADGET/UDC"
                  break
              done
          }

          stop_service() {
              [ -e "$GADGET/UDC" ] && echo none > "$GADGET/UDC" || true
              killall adbd 2>/dev/null || true
          }
          EOF
          chmod 0755 files/etc/init.d/adbd

          cat > files/etc/uci-defaults/99-ufi001c-luci-only <<'EOF'
          #!/bin/sh
          set -eu

          uci set system.@system[0].hostname='UFI-001C'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.100.1'
          uci set network.lan.netmask='255.255.255.0'

          if [ ! -s /etc/config/wireless ]; then
            wifi config 2>/dev/null || true
          fi

          AP_SECTION=$(uci -q show wireless | sed -n "s/^\\(wireless\\.[^=]*\\)=wifi-iface$/\\1/p" | head -n 1)
          if [ -z "$AP_SECTION" ]; then
            AP_SECTION='wireless.ufi_ap'
            uci set "$AP_SECTION=wifi-iface"
          fi

          uci set "$AP_SECTION.device=radio0"
          uci set "$AP_SECTION.mode=ap"
          uci set "$AP_SECTION.network=lan"
          uci set "$AP_SECTION.ssid=__WIFI_SSID__"
          if [ -n "__WIFI_PASSWORD__" ]; then
            uci set "$AP_SECTION.encryption=psk2"
            uci set "$AP_SECTION.key=__WIFI_PASSWORD__"
          else
            uci set "$AP_SECTION.encryption=none"
            uci -q delete "$AP_SECTION.key" || true
          fi
          uci set "$AP_SECTION.disabled=0"
          uci set wireless.radio0.disabled='0' 2>/dev/null || true

          uci set uhttpd.main.listen_http='0.0.0.0:80' 2>/dev/null || true
          uci commit system
          uci commit network
          uci commit wireless
          uci commit uhttpd
          /etc/init.d/uhttpd enable 2>/dev/null || true
          printf 'root:%s\n' '__ROOT_PASSWORD__' | chpasswd
          exit 0
          EOF

          sed -i \
            -e "s/__WIFI_SSID__/$WIFI_SSID/g" \
            -e "s/__WIFI_PASSWORD__/$WIFI_PASSWORD/g" \
            -e "s/__ROOT_PASSWORD__/$ROOT_PASSWORD/g" \
            files/etc/uci-defaults/99-ufi001c-luci-only
          chmod 0755 files/etc/uci-defaults/99-ufi001c-luci-only

          cat > files/README-LUCI.txt <<EOF
          ImmortalWrt UFI-001C ${FIRMWARE_VERSION}
          Image: LuCI web interface, Wi-Fi AP, USB ADB and PassWall/Xray.
          LuCI address: http://192.168.100.1
          Wi-Fi SSID: ${WIFI_SSID}
          Wi-Fi security: open (no password)
          Default root/LuCI password: ${ROOT_PASSWORD}
          USB ADB: enabled by android-tools-adbd and FunctionFS
          VMess server: configure an inbound in LuCI -> Services -> PassWall.
          EOF

      - name: Download package sources
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          # Serial download avoids misleading parallel failures from the
          # openstick feed and makes the failing source visible in the log.
          make download -j1 V=s

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -uo pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build-parallel.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            make -j1 V=s 2>&1 | tee build-single.log
            status=${PIPESTATUS[0]}
          fi
          [[ "$status" -eq 0 ]] || exit "$status"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ufi001c-luci-build-logs-${{ github.run_number }}
          if-no-files-found: ignore
          compression-level: 0
          path: openwrt/build-*.log

      - name: Verify build output
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          TARGET_DIR="bin/targets/msm89xx/msm8916"
          test -d "$TARGET_DIR"
          BOOT_IMAGE="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*-boot.img' -print -quit)"
          SYSTEM_IMAGE="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*-system.img' -print -quit)"
          [[ -n "$BOOT_IMAGE" && -n "$SYSTEM_IMAGE" ]] || {
            echo "::error::boot/system image not found"
            find "$TARGET_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          }
          find "$TARGET_DIR" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$TARGET_DIR/SHA256SUMS"
          cat "$TARGET_DIR/SHA256SUMS"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ufi001c-luci-adb-passwall-${{ env.FIRMWARE_VERSION }}-${{ github.run_number }}
          if-no-files-found: error
          compression-level: 0
          path: |
            openwrt/bin/targets/msm89xx/msm8916/**
            openwrt/.config
