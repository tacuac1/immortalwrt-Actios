name: Build ImmortalWrt UFI-001C LuCI Minimal

on:
  workflow_dispatch:
    inputs:
      custom_hash:
        description: "ImmortalWrt commit hash; blank = latest master"
        required: false
        default: ""
        type: string
      wifi_ssid:
        description: "Wi-Fi SSID used to open LuCI"
        required: false
        default: "UFI-001C-Router"
        type: string
      wifi_password:
        description: "Wi-Fi password; leave blank for an open network"
        required: false
        default: ""
        type: string
      root_password:
        description: "LuCI root password; 8-63 safe ASCII characters"
        required: false
        default: "phuong3006"
        type: string

env:
  REPO_URL: https://github.com/lkiuyu/immortalwrt.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai
  FIRMWARE_VERSION: v3.1.20
  PASSWALL_LUCI_URL: https://github.com/Openwrt-Passwall/openwrt-passwall.git
  PASSWALL_PACKAGES_URL: https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git

jobs:
  build:
    name: Build UFI-001C LuCI minimal firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read

    env:
      CUSTOM_HASH: ${{ inputs.custom_hash }}
      WIFI_SSID: ${{ inputs.wifi_ssid }}
      WIFI_PASSWORD: ${{ inputs.wifi_password }}
      ROOT_PASSWORD: ${{ inputs.root_password }}

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 \
            python3-distutils python3-pip python3-ply python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl jq ninja-build \
            p7zip-full gettext-base xsltproc swig time libelf-dev \
            libdw-dev android-sdk-libsparse-utils mkbootimg qemu-utils \
            re2c squashfs-tools subversion texinfo zstd e2fsprogs
          sudo ln -sf "/usr/share/zoneinfo/${TZ}" /etc/localtime
          echo "${TZ}" | sudo tee /etc/timezone
          command -v mkbootimg
          command -v img2simg

      - name: Clone ImmortalWrt
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
          if [[ -n "$CUSTOM_HASH" ]]; then
            [[ "$CUSTOM_HASH" =~ ^[0-9a-fA-F]{7,64}$ ]] || {
              echo "::error::custom_hash must be a valid Git commit hash"
              exit 1
            }
            git -C openwrt fetch --depth=1 origin "$CUSTOM_HASH"
            git -C openwrt checkout --detach "$CUSTOM_HASH"
          fi
          git -C openwrt log -1 --oneline

      - name: Set up Go for Xray
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Restore libffi package if required by this source snapshot
        working-directory: openwrt
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f package/libs/libffi/Makefile ]]; then
            mkdir -p package/libs/libffi
            curl --fail --show-error --location --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/openwrt/openwrt/9b835ec626/package/libs/libffi/Makefile" \
              --output package/libs/libffi/Makefile
          fi
          test -s package/libs/libffi/Makefile

      - name: Update and install standard feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          # The repository may already list the legacy HandsomeMod feed.
          # Do not install that entire feed: only android-tools is copied
          # later, while its old graphics packages are incompatible here.
          sed -i '/^src-git handsomefeed /d' feeds.conf.default
          rm -rf feeds/handsomefeed package/feeds/handsomefeed
          ./scripts/feeds update -a
          # Install only packages used by this image. Installing every feed
          # package pulls legacy Qt5/video Kconfig entries into defconfig;
          # several of those entries self-depend and produce recursive
          # dependency diagnostics even though they are not selected.
          ./scripts/feeds install -f \
            luci luci-base luci-app-firewall

      - name: Fix UFI-001C Qualcomm firmware source hash
        working-directory: openwrt
        shell: bash
        run: |
          set -Eeuo pipefail
          QCOM_MAKEFILE="$(find -L feeds/openstick -type f \
            -path '*/qcom-firmware/Makefile' -print -quit)"
          test -n "$QCOM_MAKEFILE"
          # The pinned qcom-firmware git archive generated by OpenWrt has this
          # reproducible hash; the feed's stale hash causes make download to
          # report a mismatch before the UFI-001C Wi-Fi firmware is packaged.
          sed -E -i 's/^[[:space:]]*PKG_MIRROR_HASH[[:space:]]*:=.*/PKG_MIRROR_HASH:=fa7ee67ad81464bd1de66266e3426ead5690c167fa11477002cabf06c3e37374/' "$QCOM_MAKEFILE"
          grep -Eq '^[[:space:]]*PKG_MIRROR_HASH[[:space:]]*:=fa7ee67ad81464bd1de66266e3426ead5690c167fa11477002cabf06c3e37374[[:space:]]*$' "$QCOM_MAKEFILE"

      - name: Add HandsomeMod adbd feed
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^src-git handsomefeed ' feeds.conf.default || \
            printf '%s\n' 'src-git handsomefeed https://github.com/HandsomeMod/handsomefeed.git' >> feeds.conf.default
          # Do not run scripts/feeds update for this legacy feed: it parses
          # incompatible graphics packages (kmscube/weston/mesa) and exits 1.
          # Clone it only to copy the single android-tools package we need.
          rm -rf feeds/handsomefeed
          git clone --depth=1 https://github.com/HandsomeMod/handsomefeed.git feeds/handsomefeed
          ADB_SOURCE_MAKEFILE="$(find -L feeds/handsomefeed -type f -name Makefile -print0 \
            | xargs -0 grep -l '^PKG_NAME:=android-tools$' \
            | head -n 1)"
          test -n "$ADB_SOURCE_MAKEFILE"
          rm -rf package/utils/android-tools
          mkdir -p package/utils
          cp -a "$(dirname "$ADB_SOURCE_MAKEFILE")" package/utils/android-tools
          ADB_MAKEFILE=package/utils/android-tools/Makefile
          # The feed contains the package recipe only; adb.c is downloaded into
          # build_dir later. Patch it through OpenWrt's normal package patch
          # mechanism instead of looking for source files in the feed checkout.
          ADB_PATCH=package/utils/android-tools/patches/100-musl-adbd.patch
          mkdir -p "$(dirname "$ADB_PATCH")"
          cat > "$ADB_PATCH" <<'PATCH'
          --- a/core/adbd/adb.c
          +++ b/core/adbd/adb.c
          @@ -33,7 +33,8 @@
           #if !ADB_HOST
           #include "android_filesystem_config.h"
           #include <linux/capability.h>
           #include <linux/prctl.h>
          +#include <sys/syscall.h>
           #include <sys/mount.h>
           #else
           #include "usb_vendors.h"
          @@ -1168,6 +1168,6 @@
                   struct __user_cap_header_struct header;
                   struct __user_cap_data_struct cap[2];
          
          -        if (prctl(PR_SET_KEEPCAPS, 1, 0, 0, 0) != 0) {
          +        if (syscall(SYS_prctl, PR_SET_KEEPCAPS, 1, 0, 0, 0) != 0) {
                       exit(1);
                   }
          @@ -1205,5 +1205,5 @@
                   cap[CAP_TO_INDEX(CAP_SYS_BOOT)].effective |= CAP_TO_MASK(CAP_SYS_BOOT);
                   cap[CAP_TO_INDEX(CAP_SYS_BOOT)].permitted |= CAP_TO_MASK(CAP_SYS_BOOT);
          -        capset(&header, cap);
          +        syscall(SYS_capset, &header, cap);
                   D("Local port disabled\n");
               } else {
          --- a/core/adbd/adb_auth_client.c
          +++ b/core/adbd/adb_auth_client.c
          @@ -55,1 +55,2 @@
          +extern int b64_pton(char const *src, u_char *target, size_t targsize);
           static void read_keys(const char *file, struct listnode *list)
          --- a/adbd.mk
          +++ b/adbd.mk
          @@ -1,1 +1,2 @@
           adbd_SRC_FILES += adb_auth_client.c
          +adbd_SRC_FILES += base64.c
          PATCH
          test -s "$ADB_PATCH"
          grep -q 'syscall(SYS_capset, &header, cap);' "$ADB_PATCH"
          grep -q 'extern int b64_pton' "$ADB_PATCH"
          grep -q 'adbd_SRC_FILES += base64.c' "$ADB_PATCH"
          # The feed uses the old package name; current OpenWrt calls it
          # kmod-usb-gadget-fs (USB FunctionFS support).
          sed -i 's/kmod-usb-gadget-functionfs/kmod-usb-gadget-fs/g' "$ADB_MAKEFILE"
          # apk rejects the legacy '+' in 4.2.2+git20130218. Keep the same
          # source commit while using a package-version-safe representation.
          sed -i 's/^PKG_VERSION:=4\.2\.2+git20130218$/PKG_VERSION:=4.2.2.20130218/' "$ADB_MAKEFILE"
          # Keep the original source directory/archive identity so the pinned
          # mirror hash remains valid; only the package metadata version changes.
          sed -i \
            -e 's#^PKG_SOURCE_SUBDIR:=.*#PKG_SOURCE_SUBDIR:=$(PKG_NAME)-4.2.2+git20130218#' \
            -e 's#^PKG_SOURCE:=$(PKG_NAME)-.*#PKG_SOURCE:=$(PKG_NAME)-4.2.2+git20130218-$(PKG_SOURCE_VERSION).tar.gz#' \
            "$ADB_MAKEFILE"
          test -f "$ADB_MAKEFILE"
          grep -q '^PKG_VERSION:=4\.2\.2\.20130218$' "$ADB_MAKEFILE"
          grep -Fqx 'PKG_SOURCE_SUBDIR:=$(PKG_NAME)-4.2.2+git20130218' "$ADB_MAKEFILE"
          grep -Fqx 'PKG_SOURCE:=$(PKG_NAME)-4.2.2+git20130218-$(PKG_SOURCE_VERSION).tar.gz' "$ADB_MAKEFILE"

      - name: Configure FunctionFS ADB plus RNDIS kernel modules
        working-directory: openwrt
        shell: bash
        run: |
          set -Eeuo pipefail
          USB_MODULES_MK=package/kernel/linux/modules/usb.mk
          test -f "$USB_MODULES_MK"

          awk '
            /^define KernelPackage\/usb-gadget-fs$/ { in_block=1 }
            in_block && /^endef$/ { in_block=0 }
            in_block && skip && /^[[:space:]]+CONFIG_/ { next }
            in_block && skip { skip=0 }
            # Different ImmortalWrt snapshots format this as either
            # `KCONFIG:=CONFIG_USB_FUNCTIONFS \` or `KCONFIG:= \` followed by
            # CONFIG_USB_FUNCTIONFS on the next line. Replace both forms.
            in_block && /^[[:space:]]+KCONFIG[[:space:]]*:=/ {
              print "  KCONFIG:=CONFIG_USB_FUNCTIONFS \134";
              print "\tCONFIG_USB_FUNCTIONFS_ETH=n \134";
              print "\tCONFIG_USB_FUNCTIONFS_RNDIS=n \134";
              print "\tCONFIG_USB_CONFIGFS_NCM=n \134";
              print "\tCONFIG_USB_CONFIGFS_ECM=n \134";
              print "\tCONFIG_USB_CONFIGFS_ECM_SUBSET=n \134";
              print "\tCONFIG_USB_CONFIGFS_RNDIS=y \134";
              print "\tCONFIG_USB_CONFIGFS_EEM=n \134";
              print "\tCONFIG_USB_ETH=n \134";
              print "\tCONFIG_USB_ETH_RNDIS=n \134";
              print "\tCONFIG_USB_ETH_EEM=n \134";
              print "\tCONFIG_USB_G_NCM=n";
              skip=1
              replaced=1
              next
            }
            in_block && /^[[:space:]]+FILES[[:space:]]*:=/ {
              print
              print "\t$(LINUX_DIR)/drivers/usb/gadget/function/u_ether.ko \134"
              print "\t$(LINUX_DIR)/drivers/usb/gadget/function/usb_f_rndis.ko \134"
              files_added=1
              next
            }
            { print }
            END { if (!replaced || !files_added) exit 1 }
          ' "$USB_MODULES_MK" > "$USB_MODULES_MK.tmp"
          mv "$USB_MODULES_MK.tmp" "$USB_MODULES_MK"

          awk '
            /^define KernelPackage\/usb-gadget-fs$/ { in_block=1 }
            in_block && /^endef$/ { in_block=0 }
            in_block && /CONFIG_USB_FUNCTIONFS_ETH=n/ { eth=1 }
            in_block && /CONFIG_USB_CONFIGFS_RNDIS=y/ { configfs_rndis=1 }
            in_block && /CONFIG_USB_CONFIGFS_ECM=n/ { ecm=1 }
            in_block && /CONFIG_USB_CONFIGFS_NCM=n/ { ncm=1 }
            in_block && /CONFIG_USB_CONFIGFS_EEM=n/ { eem=1 }
            in_block && /drivers\/usb\/gadget\/function\/u_ether\.ko/ { uether=1 }
            in_block && /drivers\/usb\/gadget\/function\/usb_f_rndis\.ko/ { rndis=1 }
            END { exit !(eth && configfs_rndis && ecm && ncm && eem && uether && rndis) }
          ' "$USB_MODULES_MK"

      - name: Add PassWall and Xray feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^src-git passwall_luci ' feeds.conf.default || \
            printf 'src-git passwall_luci %s;main\n' "$PASSWALL_LUCI_URL" >> feeds.conf.default
          grep -q '^src-git passwall_packages ' feeds.conf.default || \
            printf 'src-git passwall_packages %s;main\n' "$PASSWALL_PACKAGES_URL" >> feeds.conf.default
          ./scripts/feeds update passwall_luci passwall_packages
          PASSWALL_LUCI_DIR="$(dirname "$(find -L feeds/passwall_luci -type f \
            -path '*/luci-app-passwall/Makefile' -print -quit)")"
          XRAY_DIR="$(dirname "$(find -L feeds/passwall_packages -type f \
            -path '*/xray-core/Makefile' -print -quit)")"
          test -f "$PASSWALL_LUCI_DIR/Makefile"
          test -f "$XRAY_DIR/Makefile"
          rm -rf package/passwall/luci-app-passwall package/passwall/xray-core
          mkdir -p package/passwall
          cp -a "$PASSWALL_LUCI_DIR" package/passwall/luci-app-passwall
          cp -a "$XRAY_DIR" package/passwall/xray-core
          PASSWALL_MAKEFILE=package/passwall/luci-app-passwall/Makefile
          # This snapshot intentionally installs only the LuCI + Xray path.
          # The current PassWall recipe lists optional tools whose package
          # definitions are not present in the selected feeds; leaving them in
          # DEPENDS makes apk reject the entire rootfs at package/install.
          for missing_dep in \
            chinadns-ng \
            coreutils \
            coreutils-base64 \
            coreutils-nohup \
            coreutils-timeout \
            curl \
            dns2socks \
            luci-compat \
            luci-lib-jsonc \
            luci-lua-runtime \
            lyaml \
            microsocks \
            tcping; do
            sed -E -i "s/\\+${missing_dep}([[:space:]]*)/\\1/g" "$PASSWALL_MAKEFILE"
          done
          for missing_dep in \
            chinadns-ng \
            coreutils \
            coreutils-base64 \
            coreutils-nohup \
            coreutils-timeout \
            curl \
            dns2socks \
            luci-compat \
            luci-lib-jsonc \
            luci-lua-runtime \
            lyaml \
            microsocks \
            tcping; do
            ! grep -Fq -- "+${missing_dep}" "$PASSWALL_MAKEFILE"
          done

      - name: Configure UFI-001C, LuCI, USB ADB and RNDIS
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          [[ "$WIFI_SSID" =~ ^[A-Za-z0-9._\ -]{1,32}$ ]] || {
            echo "::error::wifi_ssid must contain 1-32 safe ASCII characters"
            exit 1
          }
          [[ -z "$WIFI_PASSWORD" || "$WIFI_PASSWORD" =~ ^[A-Za-z0-9._@#%+\-]{8,63}$ ]] || {
            echo "::error::wifi_password must be blank or contain 8-63 safe ASCII characters"
            exit 1
          }
          [[ "$ROOT_PASSWORD" =~ ^[A-Za-z0-9._@#%+\-]{8,63}$ ]] || {
            echo "::error::root_password must contain 8-63 safe ASCII characters"
            exit 1
          }

          cat > .config <<'EOF'
          CONFIG_TARGET_msm89xx=y
          CONFIG_TARGET_msm89xx_msm8916=y
          CONFIG_TARGET_DEVICE_msm89xx_msm8916_DEVICE_openstick-ufi001c=y

          # LuCI web interface and minimum HTTP/UBUS dependencies.
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-ucode=y
          CONFIG_PACKAGE_wpad-basic-wolfssl=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y

          # ADB + RNDIS over the device USB port.
          CONFIG_PACKAGE_android-tools-adbd=y
          CONFIG_PACKAGE_kmod-usb-gadget=y
          CONFIG_PACKAGE_kmod-usb-lib-composite=y
          CONFIG_PACKAGE_kmod-usb-gadget-fs=y
          CONFIG_PACKAGE_kmod-fs-configfs=y

          # PassWall/Xray support for creating a VMess server in LuCI.
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=n

          # Exclude unrelated services and add-on functions.
          CONFIG_PACKAGE_luci-app-ttyd=n
          CONFIG_PACKAGE_ttyd=n
          CONFIG_PACKAGE_dropbear=n
          CONFIG_PACKAGE_relayd=n
          CONFIG_PACKAGE_luci-proto-relay=n
          CONFIG_PACKAGE_modemmanager=n
          CONFIG_PACKAGE_qmi-utils=n
          CONFIG_PACKAGE_uqmi=n
          CONFIG_PACKAGE_kmod-usb-net-rndis=n
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=n
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=n
          EOF

          printf 'CONFIG_TARGET_ROOTFS_PWD="%s"\n' "$ROOT_PASSWORD" >> .config
          make defconfig

          grep -qx 'CONFIG_TARGET_msm89xx=y' .config
          grep -qx 'CONFIG_TARGET_msm89xx_msm8916=y' .config
          grep -qx 'CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-ufi001c=y' .config
          grep -q '^CONFIG_PACKAGE_luci=y$' .config
          grep -q '^CONFIG_PACKAGE_uhttpd=y$' .config
          grep -q '^CONFIG_PACKAGE_uhttpd-mod-ubus=y$' .config
          grep -q '^CONFIG_PACKAGE_android-tools-adbd=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-usb-gadget-fs=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y$' .config
          grep -q '^CONFIG_PACKAGE_xray-core=y$' .config

          mkdir -p files/etc/uci-defaults files/etc/init.d

          # Replace the feed init script with a configfs composite gadget that
          # exposes FunctionFS ADB and an RNDIS network on the USB device port.
          cat > files/etc/init.d/adbd <<'EOF'
          #!/bin/sh /etc/rc.common
          START=80
          STOP=99
          USE_PROCD=1

          GADGET=/sys/kernel/config/usb_gadget/ufi001c
          FFS=/dev/usb-ffs/adb
          RNDIS_FUNCTION=$GADGET/functions/rndis.usb0

          start_service() {
              modprobe usb_f_fs 2>/dev/null || true
              modprobe usb_f_rndis 2>/dev/null || true
              modprobe libcomposite 2>/dev/null || true
              mkdir -p /sys/kernel/config /dev/usb-ffs/adb
              mountpoint -q /sys/kernel/config || mount -t configfs configfs /sys/kernel/config
              mountpoint -q "$FFS" || mount -t functionfs adb "$FFS"

              procd_open_instance
              procd_set_param command /usr/bin/adbd -D
              procd_set_param respawn
              procd_close_instance

              i=0
              while [ ! -e "$FFS/ep0" ] && [ "$i" -lt 10 ]; do
                  sleep 1
                  i=$((i + 1))
              done
              [ -e "$FFS/ep0" ] || return 0

              mkdir -p "$GADGET/strings/0x409" "$GADGET/configs/c.1/strings/0x409" "$GADGET/functions/ffs.adb" "$RNDIS_FUNCTION"
              echo 0x18d1 > "$GADGET/idVendor"
              echo 0x4ee7 > "$GADGET/idProduct"
              echo UFI001C > "$GADGET/strings/0x409/serialnumber"
              echo UFI-001C > "$GADGET/strings/0x409/manufacturer"
              echo 'ImmortalWrt UFI-001C ADB+RNDIS' > "$GADGET/strings/0x409/product"
              echo 0x80 > "$GADGET/configs/c.1/bmAttributes"
              echo 500 > "$GADGET/configs/c.1/MaxPower"
              echo 02:00:00:01:00:1c > "$RNDIS_FUNCTION/dev_addr"
              echo 02:00:00:01:00:1d > "$RNDIS_FUNCTION/host_addr"
              ln -sf "$GADGET/functions/ffs.adb" "$GADGET/configs/c.1/ffs.adb"
              ln -sf "$RNDIS_FUNCTION" "$GADGET/configs/c.1/rndis.usb0"

              for udc in /sys/class/udc/*; do
                  [ -e "$udc" ] || continue
                  echo "$(basename "$udc")" > "$GADGET/UDC"
                  break
              done
              ifup lan 2>/dev/null || true
          }

          stop_service() {
              [ -e "$GADGET/UDC" ] && echo none > "$GADGET/UDC" || true
              killall adbd 2>/dev/null || true
          }
          EOF
          chmod 0755 files/etc/init.d/adbd

          cat > files/etc/uci-defaults/99-ufi001c-luci-only <<'EOF'
          #!/bin/sh
          set -eu

          uci set system.@system[0].hostname='UFI-001C'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.100.1'
          uci set network.lan.netmask='255.255.255.0'

          # Put the USB RNDIS interface into the existing LAN bridge so Wi-Fi,
          # Ethernet and USB all use the same LuCI address: 192.168.100.1.
          LAN_DEVICE=$(uci -q get network.lan.device || echo br-lan)
          LAN_DEVICE_SECTION=$(uci -q show network | sed -n "s/^\(network\.[^=]*\)\.name='$LAN_DEVICE'$/\1/p" | head -n 1)
          if [ -n "$LAN_DEVICE_SECTION" ]; then
            uci add_list "$LAN_DEVICE_SECTION.ports=usb0"
          else
            uci set network.br_lan='device'
            uci set network.br_lan.name='br-lan'
            uci set network.br_lan.type='bridge'
            uci add_list network.br_lan.ports='usb0'
            uci set network.lan.device='br-lan'
          fi

          if [ ! -s /etc/config/wireless ]; then
            wifi config 2>/dev/null || true
          fi

          AP_SECTION=$(uci -q show wireless | sed -n "s/^\\(wireless\\.[^=]*\\)=wifi-iface$/\\1/p" | head -n 1)
          if [ -z "$AP_SECTION" ]; then
            AP_SECTION='wireless.ufi_ap'
            uci set "$AP_SECTION=wifi-iface"
          fi

          uci set "$AP_SECTION.device=radio0"
          uci set "$AP_SECTION.mode=ap"
          uci set "$AP_SECTION.network=lan"
          uci set "$AP_SECTION.ssid=__WIFI_SSID__"
          if [ -n "__WIFI_PASSWORD__" ]; then
            uci set "$AP_SECTION.encryption=psk2"
            uci set "$AP_SECTION.key=__WIFI_PASSWORD__"
          else
            uci set "$AP_SECTION.encryption=none"
            uci -q delete "$AP_SECTION.key" || true
          fi
          uci set "$AP_SECTION.disabled=0"
          uci set wireless.radio0.disabled='0' 2>/dev/null || true

          uci set uhttpd.main.listen_http='0.0.0.0:80' 2>/dev/null || true
          uci commit system
          uci commit network
          uci commit wireless
          uci commit uhttpd
          /etc/init.d/uhttpd enable 2>/dev/null || true
          printf 'root:%s\n' '__ROOT_PASSWORD__' | chpasswd
          exit 0
          EOF

          sed -i \
            -e "s/__WIFI_SSID__/$WIFI_SSID/g" \
            -e "s/__WIFI_PASSWORD__/$WIFI_PASSWORD/g" \
            -e "s/__ROOT_PASSWORD__/$ROOT_PASSWORD/g" \
            files/etc/uci-defaults/99-ufi001c-luci-only
          chmod 0755 files/etc/uci-defaults/99-ufi001c-luci-only

          cat > files/README-LUCI.txt <<EOF
          ImmortalWrt UFI-001C ${FIRMWARE_VERSION}
          Image: LuCI web interface, Wi-Fi AP, USB ADB + RNDIS and PassWall/Xray.
          LuCI address: http://192.168.100.1
          USB RNDIS address: http://192.168.100.1 (same LAN bridge/DHCP)
          Wi-Fi SSID: ${WIFI_SSID}
          Wi-Fi security: open (no password)
          Default root/LuCI password: ${ROOT_PASSWORD}
          USB ADB: enabled by android-tools-adbd and FunctionFS
          USB RNDIS: enabled as a composite USB gadget with ADB
          VMess server: configure an inbound in LuCI -> Services -> PassWall.
          EOF

      - name: Download package sources
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          # Serial download avoids misleading parallel failures from the
          # openstick feed and makes the failing source visible in the log.
          make download -j1 V=s

      - name: Prepare and verify android-tools compatibility patch
        working-directory: openwrt
        shell: bash
        run: |
          set -Eeuo pipefail
          # Force the package prepare phase now, so patch failures are reported
          # before the full firmware build starts.
          make package/utils/android-tools/prepare V=s
          ADB_SOURCE="$(find -L build_dir -type f -path '*/core/adbd/adb.c' -print -quit)"
          ADB_AUTH_SOURCE="$(find -L build_dir -type f -path '*/core/adbd/adb_auth_client.c' -print -quit)"
          ADB_MK="$(find -L build_dir -type f -name adbd.mk -print -quit)"
          test -n "$ADB_SOURCE"
          test -n "$ADB_AUTH_SOURCE"
          test -n "$ADB_MK"
          grep -q '#include <sys/syscall.h>' "$ADB_SOURCE"
          grep -q 'syscall(SYS_prctl, PR_SET_KEEPCAPS' "$ADB_SOURCE"
          grep -q 'syscall(SYS_capset, &header, cap);' "$ADB_SOURCE"
          grep -q 'extern int b64_pton' "$ADB_AUTH_SOURCE"
          grep -q 'adbd_SRC_FILES += base64.c' "$ADB_MK"

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -uo pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build-parallel.log
          status=${PIPESTATUS[0]}
          # SIGTERM/SIGINT means the runner was canceled or shut down; retrying
          # serially only wastes the remaining cancellation window.
          if [[ "$status" -ne 0 && "$status" -ne 130 && "$status" -ne 143 ]]; then
            make -j1 V=s 2>&1 | tee build-single.log
            status=${PIPESTATUS[0]}
          fi
          [[ "$status" -eq 0 ]] || exit "$status"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ufi001c-luci-build-logs-${{ github.run_number }}
          if-no-files-found: ignore
          compression-level: 0
          path: openwrt/build-*.log

      - name: Verify build output
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          TARGET_DIR="bin/targets/msm89xx/msm8916"
          test -d "$TARGET_DIR"
          BOOT_IMAGE="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*-boot.img' -print -quit)"
          SYSTEM_IMAGE="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*-system.img' -print -quit)"
          [[ -n "$BOOT_IMAGE" && -n "$SYSTEM_IMAGE" ]] || {
            echo "::error::boot/system image not found"
            find "$TARGET_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          }
          find "$TARGET_DIR" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$TARGET_DIR/SHA256SUMS"
          cat "$TARGET_DIR/SHA256SUMS"

      - name: Verify Wi-Fi and USB ADB/RNDIS payload
        working-directory: openwrt
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET_DIR="bin/targets/msm89xx/msm8916"
          SYSTEM_ARCHIVE="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*-ext4-system.img.gz' -print -quit)"
          [[ -n "$SYSTEM_ARCHIVE" ]] || { echo "ext4 system image archive not found" >&2; find "$TARGET_DIR" -maxdepth 1 -type f -printf '%f\n'; exit 1; }
          SPARSE_IMAGE="$RUNNER_TEMP/ufi001c-system.sparse.img"
          RAW_IMAGE="$RUNNER_TEMP/ufi001c-system.raw.img"
          gzip -cd "$SYSTEM_ARCHIVE" > "$SPARSE_IMAGE"
          simg2img "$SPARSE_IMAGE" "$RAW_IMAGE"

          debugfs_stat() {
            local path="$1"
            local output
            output="$(debugfs -R "stat $path" "$RAW_IMAGE" 2>&1 || true)"
            if grep -qE '^Inode:' <<< "$output"; then
              printf '%s\n' "$output"
              return 0
            fi
            printf 'missing %s\n%s\n' "$path" "$output" >&2
            return 1
          }

          debugfs_stat /etc/init.d/adbd >/dev/null
          debugfs_stat /lib/firmware/wlan/prima/WCNSS_qcom_wlan_nv.bin >/dev/null

          FIRMWARE_FOUND=0
          for firmware in \
            /lib/firmware/wlan/prima/wcnss.mdt \
            /lib/firmware/wlan/prima/WCNSS_qcom_wlan.mdt; do
            if debugfs_stat "$firmware" >/dev/null; then
              echo "found Wi-Fi firmware: $firmware"
              FIRMWARE_FOUND=1
              break
            fi
          done
          [[ "$FIRMWARE_FOUND" -eq 1 ]] || { echo 'WCNSS firmware MDT file not found' >&2; exit 1; }

          MODULE_DUMP="$RUNNER_TEMP/ufi001c-modules"
          mkdir -p "$MODULE_DUMP"
          debugfs -R "rdump /lib/modules $MODULE_DUMP" "$RAW_IMAGE" >/dev/null 2>&1
          MODULE_LIST="$(find "$MODULE_DUMP" -type f -printf '%f\n' | sort)"
          printf '%s\n' "$MODULE_LIST"
          printf '%s\n' "$MODULE_LIST" | grep -Eq '^usb_f_rndis\.ko(\..*)?$'
          printf '%s\n' "$MODULE_LIST" | grep -Eq '^u_ether\.ko(\..*)?$'

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ufi001c-luci-adb-passwall-${{ env.FIRMWARE_VERSION }}-${{ github.run_number }}
          if-no-files-found: error
          compression-level: 0
          path: |
            openwrt/bin/targets/msm89xx/msm8916/**
            openwrt/.config
