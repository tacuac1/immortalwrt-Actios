name: "🚀 Build ImmortalWrt UFI-001C (FINAL)"

on:
  workflow_dispatch:
    inputs:
      custom_hash:
        description: "Optional upstream commit hash"
        required: false
        default: ""
        type: string
      extra_packages:
        description: "Extra packages, separated by spaces or commas"
        required: false
        default: ""
        type: string

env:
  REPO_URL: "https://github.com/lkiuyu/immortalwrt"
  REPO_BRANCH: "master"
  TZ: "Asia/Shanghai"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write

    steps:

      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            zip \
            p7zip-full \
            gettext-base \
            xsltproc \
            swig \
            time \
            libelf-dev \
            libdw-dev

          sudo timedatectl set-timezone "$TZ"

      - name: Install mkbootimg
        run: |
          wget -q https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
          sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb || true
          sudo apt-get install -f -y
          command -v mkbootimg || true

      - name: Clone ImmortalWrt
        working-directory: ${{ github.workspace }}
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          test -w "$GITHUB_WORKSPACE" || {
            echo "::error::GitHub workspace is not writable"
            ls -ld "$GITHUB_WORKSPACE"
            exit 1
          }

          rm -rf "$GITHUB_WORKSPACE/openwrt"

          git clone --depth=1 \
            -b "$REPO_BRANCH" \
            "$REPO_URL" \
            "$GITHUB_WORKSPACE/openwrt"

          if [ -n "${{ inputs.custom_hash }}" ]; then
            cd openwrt
            git fetch --depth=1 origin "${{ inputs.custom_hash }}"
            git checkout "${{ inputs.custom_hash }}"
          fi

          test -d "$GITHUB_WORKSPACE/openwrt/.git" || {
            echo "::error::ImmortalWrt clone did not create a git work tree"
            exit 1
          }

          test -w "$GITHUB_WORKSPACE/openwrt" || {
            echo "::error::Cloned ImmortalWrt directory is not writable"
            ls -ld "$GITHUB_WORKSPACE/openwrt"
            exit 1
          }


      - name: Apply repository custom files and feeds
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          # Keep compatibility with the original build repository layout.
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            rm -rf files
            cp -a "$GITHUB_WORKSPACE/files" ./files
          fi

          if [ -f "$GITHUB_WORKSPACE/feeds.conf.default" ]; then
            cp "$GITHUB_WORKSPACE/feeds.conf.default" ./feeds.conf.default
          fi

          if [ -f "$GITHUB_WORKSPACE/diy-part1.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/diy-part1.sh"
            "$GITHUB_WORKSPACE/diy-part1.sh"
          fi

      - name: Update feeds
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: Load UFI-001C configuration
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          if [ -f "$GITHUB_WORKSPACE/config/ufi001c.config" ]; then
            cp "$GITHUB_WORKSPACE/config/ufi001c.config" .config
          else
            echo "::error::config/ufi001c.config not found"
            exit 1
          fi

          grep -E \
            '^CONFIG_TARGET_msm89xx|^CONFIG_TARGET_PROFILE|^CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-ufi001c|^CONFIG_DEFAULT_qcom-msm8916-modem-openstick-ufi001c-firmware|^CONFIG_DEFAULT_qcom-msm8916-openstick-ufi001c-wcnss-firmware|^CONFIG_DEFAULT_qcom-msm8916-wcnss-openstick-ufi001c-nv' \
            .config || true

          if [ -f "$GITHUB_WORKSPACE/diy-part2.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/diy-part2.sh"
            "$GITHUB_WORKSPACE/diy-part2.sh"
          fi

      - name: Add HomeProxy
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          rm -rf package/luci-app-homeproxy /tmp/homeproxy

          for n in 1 2 3; do
            rm -rf /tmp/homeproxy
            if git clone --depth=1 \
              https://github.com/immortalwrt/homeproxy.git \
              /tmp/homeproxy; then
              break
            fi
            echo "HomeProxy clone failed (attempt $n/3)"
            sleep 5
          done

          test -f /tmp/homeproxy/Makefile || {
            echo "::error::Unable to clone ImmortalWrt HomeProxy"
            exit 1
          }

          cp -a /tmp/homeproxy package/luci-app-homeproxy
          rm -rf /tmp/homeproxy

          echo "HomeProxy package installed:"
          test -f package/luci-app-homeproxy/Makefile
          grep -n "PKG_NAME\|sing-box" package/luci-app-homeproxy/Makefile | head -30 || true

      - name: Add UFI-001C control package
        working-directory: ${{ github.workspace }}/openwrt
        run: |

          rm -rf package/ufi001c-control

          mkdir -p \
            package/ufi001c-control/luasrc/controller \
            package/ufi001c-control/luasrc/model/cbi \
            package/ufi001c-control/root/etc/config \
            package/ufi001c-control/root/usr/sbin

          cat > package/ufi001c-control/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=ufi001c-control
          PKG_RELEASE:=1

          include $(INCLUDE_DIR)/package.mk

          define Package/ufi001c-control
            SECTION:=luci
            CATEGORY:=LuCI
            SUBMENU:=3. Applications
            TITLE:=UFI-001C modem and proxy control
            DEPENDS:=+luci-base +luci-compat +modemmanager +luci-proto-modemmanager +luci-app-homeproxy
          endef

          define Package/ufi001c-control/description
           LuCI control panel for UFI-001C 3G/4G mode and HomeProxy
          endef

          define Build/Compile
          endef

          define Package/ufi001c-control/install
            $(INSTALL_DIR) $(1)/usr/lib/lua/luci/controller
            $(INSTALL_DIR) $(1)/usr/lib/lua/luci/model/cbi
            $(INSTALL_DIR) $(1)/etc/config
            $(INSTALL_DIR) $(1)/usr/sbin

            $(CP) ./luasrc/controller/* $(1)/usr/lib/lua/luci/controller/
            $(CP) ./luasrc/model/cbi/* $(1)/usr/lib/lua/luci/model/cbi/
            $(CP) ./root/etc/config/* $(1)/etc/config/
            $(CP) ./root/usr/sbin/* $(1)/usr/sbin/

            chmod 0755 $(1)/usr/sbin/ufi001c-control
          endef

          $(eval $(call BuildPackage,ufi001c-control))
          EOF

          cat > package/ufi001c-control/root/etc/config/ufi001c <<'EOF'
          config ufi001c 'main'
            option mode '4g'
            option proxy_enabled '0'
            option subscription_url ''
          EOF

          cat > package/ufi001c-control/luasrc/controller/ufi001c.lua <<'EOF'
          module("luci.controller.ufi001c", package.seeall)

          function index()
            entry(
              {"admin", "network", "ufi001c"},
              cbi("ufi001c"),
              _("UFI-001C"),
              20
            ).dependent = false
          end
          EOF

          cat > package/ufi001c-control/luasrc/model/cbi/ufi001c.lua <<'EOF'
          local sys = require "luci.sys"

          m = Map(
            "ufi001c",
            translate("UFI-001C"),
            translate("3G/4G modem and HomeProxy control")
          )

          s = m:section(
            NamedSection,
            "main",
            "ufi001c",
            translate("UFI-001C Settings")
          )

          s.anonymous = true

          mode = s:option(
            ListValue,
            "mode",
            translate("Mobile network mode")
          )

          mode:value("3g", translate("3G only"))
          mode:value("4g", translate("4G only"))
          mode:value("3g|4g", translate("3G + 4G automatic"))
          mode.default = "4g"

          proxy = s:option(
            Flag,
            "proxy_enabled",
            translate("HomeProxy")
          )

          proxy.rmempty = false
          proxy.default = "0"
          proxy.description = translate(
            "Enable or disable HomeProxy"
          )

          sub = s:option(
            Value,
            "subscription_url",
            translate("Subscription URL")
          )

          sub.password = true
          sub.rmempty = true
          sub.description = translate(
            "Enter the subscription URL. The URL is stored locally on the router."
          )

          apply = s:option(
            Button,
            "_apply",
            translate("Apply settings")
          )

          apply.inputstyle = "apply"

          function apply.write()
            sys.call(
              "/usr/sbin/ufi001c-control apply >/tmp/ufi001c-control.log 2>&1"
            )
          end

          status = s:option(
            DummyValue,
            "_status",
            translate("Status")
          )

          function status.cfgvalue()
            return sys.exec(
              "/usr/sbin/ufi001c-control status 2>/dev/null"
            )
          end

          return m
          EOF

          cat > package/ufi001c-control/root/usr/sbin/ufi001c-control <<'EOF'
          #!/bin/sh

          UCI="/sbin/uci"
          LOGTAG="ufi001c-control"

          log_msg() {
              logger -t "$LOGTAG" "$1"
          }

          modem_id() {
              mmcli -L 2>/dev/null |
              sed -n 's#.*Modem/\([0-9][0-9]*\).*#\1#p' |
              head -n 1
          }

          set_mode() {
              MODE="$($UCI -q get ufi001c.main.mode)"
              MODEM_ID="$(modem_id)"

              [ -n "$MODEM_ID" ] || {
                  log_msg "No ModemManager modem found"
                  return 1
              }

              case "$MODE" in
                  3g)
                      ALLOWED="3g"
                      ;;
                  4g)
                      ALLOWED="4g"
                      ;;
                  3g|4g)
                      ALLOWED="3g|4g"
                      ;;
                  *)
                      ALLOWED="4g"
                      ;;
              esac

              log_msg "Setting modem $MODEM_ID allowed mode: $ALLOWED"

              mmcli -m "$MODEM_ID" \
                --set-allowed-modes="$ALLOWED" \
                >/tmp/ufi001c-mmcli.log 2>&1

              if $UCI -q get network.modem >/dev/null 2>&1; then
                  $UCI set network.modem.allowedmode="$MODE"
                  $UCI commit network
              fi

              return 0
          }

          configure_subscription() {
              SUBURL="$($UCI -q get ufi001c.main.subscription_url)"

              [ -n "$SUBURL" ] || return 0

              log_msg "Configuring HomeProxy subscription"

              if ! $UCI -q get homeproxy.subscription >/dev/null 2>&1; then
                  $UCI set homeproxy.subscription=subscription
              fi

              $UCI set homeproxy.subscription.auto_update='1'
              $UCI delete homeproxy.subscription.subscription_url 2>/dev/null || true
              $UCI add_list homeproxy.subscription.subscription_url="$SUBURL"
              $UCI commit homeproxy

              if [ -x /etc/homeproxy/scripts/update_subscriptions.uc ]; then
                  /etc/homeproxy/scripts/update_subscriptions.uc \
                    >/tmp/ufi001c-subscription.log 2>&1 || true
              fi
          }

          first_node() {
              $UCI show homeproxy 2>/dev/null |
                sed -n 's/^homeproxy\.\([^\.]*\)\.type=.*/\1/p' |
                grep -v '^subscription$' |
                head -n 1
          }

          select_first_node() {
              CURRENT="$($UCI -q get homeproxy.config.main_node)"

              if [ -n "$CURRENT" ] &&
                 [ "$CURRENT" != "nil" ]; then
                  return 0
              fi

              NODE="$(first_node)"

              if [ -n "$NODE" ]; then
                  log_msg "Selecting first HomeProxy node: $NODE"
                  $UCI set homeproxy.config.main_node="$NODE"
                  $UCI commit homeproxy
              fi
          }

          set_proxy() {
              ENABLED="$($UCI -q get ufi001c.main.proxy_enabled)"

              if [ "$ENABLED" = "1" ]; then
                  log_msg "Enabling HomeProxy"

                  configure_subscription
                  select_first_node

                  /etc/init.d/homeproxy enable >/dev/null 2>&1 || true
                  /etc/init.d/homeproxy restart >/tmp/ufi001c-homeproxy.log 2>&1 || true
              else
                  log_msg "Disabling HomeProxy"

                  /etc/init.d/homeproxy stop >/dev/null 2>&1 || true
                  /etc/init.d/homeproxy disable >/dev/null 2>&1 || true
              fi
          }

          status() {
              echo "=== UFI-001C ==="

              echo "Mode: $($UCI -q get ufi001c.main.mode || echo unknown)"

              echo "Proxy: $($UCI -q get ufi001c.main.proxy_enabled || echo 0)"

              if mmcli -L >/dev/null 2>&1; then
                  echo "ModemManager: detected"
              else
                  echo "ModemManager: not detected"
              fi

              if /etc/init.d/homeproxy status >/dev/null 2>&1; then
                  echo "HomeProxy: running"
              else
                  echo "HomeProxy: stopped"
              fi
          }

          apply_all() {
              set_mode
              configure_subscription
              set_proxy
          }

          case "$1" in
              mode)
                  set_mode
                  ;;
              proxy)
                  set_proxy
                  ;;
              subscription)
                  configure_subscription
                  ;;
              status)
                  status
                  ;;
              apply|"")
                  apply_all
                  ;;
              *)
                  echo "Usage: $0 {apply|mode|proxy|subscription|status}"
                  exit 1
                  ;;
          esac

          exit 0
          EOF

          chmod 0755 package/ufi001c-control/root/usr/sbin/ufi001c-control

      - name: Enable UFI-001C packages
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          enable_pkg() {
            PKG="$1"
            CFG="CONFIG_PACKAGE_${PKG}"

            if grep -q "^# ${CFG} is not set$" .config; then
              sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
            elif grep -q "^${CFG}=" .config; then
              sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
            else
              echo "${CFG}=y" >> .config
            fi
          }

          for pkg in \
            luci-proto-modemmanager \
            luci-app-homeproxy \
            luci-i18n-homeproxy-zh-cn \
            sing-box-tiny \
            kmod-tun \
            kmod-nft-tproxy \
            kmod-nft-socket \
            ufi001c-control
          do
            enable_pkg "$pkg"
          done

          # HomeProxy depends on the virtual package sing-box. The OpenWrt
          # sing-box-tiny variant provides that virtual package.
          grep -q '^CONFIG_PACKAGE_sing-box-tiny=y$' .config || {
            echo "::error::sing-box-tiny is missing from .config"
            exit 1
          }

          # Keep the dedicated UFI-001C modem firmware from the device config.
          enable_pkg qcom-msm8916-modem-openstick-ufi001c-firmware
          enable_pkg qcom-msm8916-openstick-ufi001c-wcnss-firmware
          enable_pkg qcom-msm8916-wcnss-openstick-ufi001c-nv

          # Extra user packages.
          RAW="${{ inputs.extra_packages }}"
          PACKAGES="$(echo "$RAW" | tr ',' ' ')"

          for pkg in $PACKAGES; do
            [ -n "$pkg" ] || continue
            case "$pkg" in
              __ip__*|__hostname__*)
                continue
                ;;
            esac
            enable_pkg "$pkg"
          done

          echo "=== UFI-001C final requested packages ==="
          grep -E \
            '^CONFIG_PACKAGE_(luci-proto-modemmanager|luci-app-homeproxy|luci-i18n-homeproxy-zh-cn|sing-box-tiny|kmod-tun|kmod-nft-tproxy|kmod-nft-socket|ufi001c-control)=' \
            .config || true

          echo "=== UFI-001C firmware packages ==="
          grep -E \
            '^CONFIG_DEFAULT_qcom-msm8916-(modem-openstick-ufi001c-firmware|openstick-ufi001c-wcnss-firmware)|^CONFIG_DEFAULT_qcom-msm8916-wcnss-openstick-ufi001c-nv|^CONFIG_PACKAGE_qcom-msm8916-modem-openstick-ufi001c-firmware=' \
            .config || true

      - name: Validate generated package files
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          test -s package/ufi001c-control/Makefile
          test -s package/ufi001c-control/root/usr/sbin/ufi001c-control
          test -s package/ufi001c-control/luasrc/controller/ufi001c.lua
          test -s package/ufi001c-control/luasrc/model/cbi/ufi001c.lua
          sh -n package/ufi001c-control/root/usr/sbin/ufi001c-control
          echo "Custom UFI-001C package validation: PASS"

      - name: Defconfig and validate
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          make defconfig

          echo "=== Target ==="
          grep -E '^CONFIG_TARGET.*DEVICE.*=y' .config

          echo "=== UFI-001C ==="
          grep -E \
            '^CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-ufi001c=y$|^CONFIG_TARGET_PROFILE="DEVICE_openstick-ufi001c"$' \
            .config

          grep -q '^CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-ufi001c=y$' .config || {
            echo "::error::UFI-001C target is missing"
            exit 1
          }

          grep -q '^CONFIG_PACKAGE_luci-app-homeproxy=y$' .config || {
            echo "::error::luci-app-homeproxy is missing"
            exit 1
          }

          # HomeProxy depends on the virtual package "sing-box".
          # sing-box-tiny PROVIDES:=sing-box, so it satisfies that dependency
          # while keeping the UFI-001C image smaller.
          grep -q '^CONFIG_PACKAGE_sing-box-tiny=y$' .config || {
            echo "::error::sing-box-tiny is missing"
            exit 1
          }

          if grep -q '^CONFIG_PACKAGE_sing-box=y$' .config; then
            echo "::warning::Full sing-box is also enabled; image will be larger."
          fi

          grep -q '^CONFIG_PACKAGE_ufi001c-control=y$' .config || {
            echo "::error::ufi001c-control is missing"
            exit 1
          }

          echo "=== Modem firmware configuration ==="
          grep -E \
            'qcom-msm8916-modem-openstick-ufi001c-firmware|qcom-msm8916-openstick-ufi001c-wcnss-firmware|qcom-msm8916-wcnss-openstick-ufi001c-nv' \
            .config || true

          echo "=== HomeProxy ==="
          grep -E '^CONFIG_PACKAGE_(luci-app-homeproxy|sing-box-tiny|kmod-tun|kmod-nft-tproxy|kmod-nft-socket)=' .config || true

      - name: Download sources
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          make download -j4 V=s
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Upload final config
        uses: actions/upload-artifact@v4
        with:
          name: UFI001C-build-config
          path: |
            $GITHUB_WORKSPACE/openwrt/.config
            $GITHUB_WORKSPACE/openwrt/feeds.conf.default
          include-hidden-files: true

      - name: Compile firmware
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          echo "CPU threads: $(nproc)"
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware
        run: |
          cd "$GITHUB_WORKSPACE"/openwrt/bin/targets/*/*

          echo "=== Firmware files ==="
          find . -maxdepth 1 -type f -printf '%f\n' | sort

          mkdir -p release_files

          cp *.manifest release_files/ 2>/dev/null || true
          cp *.buildinfo release_files/ 2>/dev/null || true
          cp sha256sums release_files/ 2>/dev/null || true

          find . \
            -maxdepth 1 \
            -type f \
            \( -name '*sysupgrade*' -o -name '*factory*' -o -name '*boot.img*' -o -name '*system.img*' \) \
            -exec cp {} release_files/ \;

          # Build a ready-to-flash package when the original repository provides
          # its flashing scripts and the target emits boot/system images.
          if [ -d "$GITHUB_WORKSPACE/刷机脚本" ]; then
            BOOT_IMG=$(ls *boot.img.gz *boot.img 2>/dev/null | head -1 || true)
            SYSTEM_IMG=$(ls *system.img.gz *system.img 2>/dev/null | head -1 || true)
            if [ -n "$BOOT_IMG" ] && [ -n "$SYSTEM_IMG" ]; then
              rm -rf flash_package
              mkdir -p flash_package

              case "$BOOT_IMG" in
                *.gz) cp "$BOOT_IMG" flash_package/boot.img.gz; gzip -dk flash_package/boot.img.gz; rm -f flash_package/boot.img.gz ;;
                *) cp "$BOOT_IMG" flash_package/boot.img ;;
              esac

              case "$SYSTEM_IMG" in
                *.gz) cp "$SYSTEM_IMG" flash_package/system.img.gz; gzip -dk flash_package/system.img.gz; rm -f flash_package/system.img.gz ;;
                *) cp "$SYSTEM_IMG" flash_package/system.img ;;
              esac

              cp -a "$GITHUB_WORKSPACE/刷机脚本/." flash_package/
              (cd flash_package && zip -qr ../OpenWrt_UFI001C_flash_package.zip .)
              cp OpenWrt_UFI001C_flash_package.zip release_files/
            fi
          fi

          test -n "$(find release_files -type f -print -quit)" || {
            echo "::error::No firmware files collected"
            exit 1
          }

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-UFI001C
          path: $GITHUB_WORKSPACE/openwrt/bin/targets/*/*/release_files/*
          if-no-files-found: error

      - name: Create release
        if: success()
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: "ufi001c-${{ github.run_number }}"
          name: "UFI-001C Build #${{ github.run_number }}"
          body: |
            ## UFI-001C

            Target:
            `openstick-ufi001c`

            Included:
            - Dedicated UFI-001C Qualcomm modem firmware package
            - WCNSS firmware/NV for UFI-001C
            - ModemManager LuCI protocol
            - HomeProxy
            - sing-box-tiny
            - UFI-001C LuCI control page
            - 3G / 4G / 3G+4G selection
            - HomeProxy enable/disable
            - Subscription URL configuration

            The subscription URL is NOT embedded in this GitHub workflow.
            Enter it locally from LuCI after flashing.

          artifacts: $GITHUB_WORKSPACE/openwrt/bin/targets/*/*/release_files/*
          artifactErrorsFailBuild: false
          allowUpdates: true
          draft: false
          prerelease: false
