name: Build ImmortalWrt UFI-001C LuCI Minimal

on:
  workflow_dispatch:
    inputs:
      custom_hash:
        description: "ImmortalWrt commit hash; blank = latest master"
        required: false
        default: ""
        type: string
      wifi_ssid:
        description: "Wi-Fi SSID used to open LuCI"
        required: false
        default: "UFI-001C-Router"
        type: string
      wifi_password:
        description: "Wi-Fi password; 8-63 ASCII characters"
        required: false
        default: "ChangeMe1234"
        type: string
      root_password:
        description: "LuCI root password; 8-63 safe ASCII characters"
        required: false
        default: "phuong3006"
        type: string

env:
  REPO_URL: https://github.com/lkiuyu/immortalwrt.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai
  FIRMWARE_VERSION: v3.0.5

jobs:
  build:
    name: Build UFI-001C LuCI minimal firmware
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    env:
      CUSTOM_HASH: ${{ inputs.custom_hash }}
      WIFI_SSID: ${{ inputs.wifi_ssid }}
      WIFI_PASSWORD: ${{ inputs.wifi_password }}
      ROOT_PASSWORD: ${{ inputs.root_password }}

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 \
            python3-distutils python3-pip python3-ply python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl jq ninja-build \
            p7zip-full gettext-base xsltproc swig time libelf-dev \
            libdw-dev android-sdk-libsparse-utils mkbootimg qemu-utils \
            re2c squashfs-tools subversion texinfo zstd
          sudo ln -sf "/usr/share/zoneinfo/${TZ}" /etc/localtime
          echo "${TZ}" | sudo tee /etc/timezone
          command -v mkbootimg
          command -v img2simg

      - name: Clone ImmortalWrt
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --single-branch -b "$REPO_BRANCH" "$REPO_URL" openwrt
          if [[ -n "$CUSTOM_HASH" ]]; then
            [[ "$CUSTOM_HASH" =~ ^[0-9a-fA-F]{7,64}$ ]] || {
              echo "::error::custom_hash must be a valid Git commit hash"
              exit 1
            }
            git -C openwrt fetch --depth=1 origin "$CUSTOM_HASH"
            git -C openwrt checkout --detach "$CUSTOM_HASH"
          fi
          git -C openwrt log -1 --oneline

      - name: Restore libffi package if required by this source snapshot
        working-directory: openwrt
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f package/libs/libffi/Makefile ]]; then
            mkdir -p package/libs/libffi
            curl --fail --show-error --location --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/openwrt/openwrt/9b835ec626/package/libs/libffi/Makefile" \
              --output package/libs/libffi/Makefile
          fi
          test -s package/libs/libffi/Makefile

      - name: Update and install standard feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: Configure UFI-001C and LuCI only
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail

          [[ "$WIFI_SSID" =~ ^[A-Za-z0-9._\ -]{1,32}$ ]] || {
            echo "::error::wifi_ssid must contain 1-32 safe ASCII characters"
            exit 1
          }
          [[ "$WIFI_PASSWORD" =~ ^[A-Za-z0-9._@#%+\-]{8,63}$ ]] || {
            echo "::error::wifi_password must contain 8-63 safe ASCII characters"
            exit 1
          }
          [[ "$ROOT_PASSWORD" =~ ^[A-Za-z0-9._@#%+\-]{8,63}$ ]] || {
            echo "::error::root_password must contain 8-63 safe ASCII characters"
            exit 1
          }

          cat > .config <<'EOF'
          CONFIG_TARGET_msm89xx=y
          CONFIG_TARGET_msm89xx_msm8916=y
          CONFIG_TARGET_DEVICE_msm89xx_msm8916_DEVICE_openstick-ufi001c=y

          # LuCI web interface and minimum HTTP/UBUS dependencies.
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-ucode=y
          CONFIG_PACKAGE_wpad-basic-wolfssl=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y

          # Exclude unrelated services and add-on functions.
          CONFIG_PACKAGE_luci-app-passwall=n
          CONFIG_PACKAGE_luci-app-ttyd=n
          CONFIG_PACKAGE_ttyd=n
          CONFIG_PACKAGE_dropbear=n
          CONFIG_PACKAGE_relayd=n
          CONFIG_PACKAGE_luci-proto-relay=n
          CONFIG_PACKAGE_modemmanager=n
          CONFIG_PACKAGE_qmi-utils=n
          CONFIG_PACKAGE_uqmi=n
          CONFIG_PACKAGE_kmod-usb-net-rndis=n
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=n
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=n
          EOF

          printf 'CONFIG_TARGET_ROOTFS_PWD="%s"\n' "$ROOT_PASSWORD" >> .config
          make defconfig

          grep -qx 'CONFIG_TARGET_msm89xx=y' .config
          grep -qx 'CONFIG_TARGET_msm89xx_msm8916=y' .config
          grep -qx 'CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-ufi001c=y' .config
          grep -q '^CONFIG_PACKAGE_luci=y$' .config
          grep -q '^CONFIG_PACKAGE_uhttpd=y$' .config
          grep -q '^CONFIG_PACKAGE_uhttpd-mod-ubus=y$' .config

          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-ufi001c-luci-only <<'EOF'
          #!/bin/sh
          set -eu

          uci set system.@system[0].hostname='UFI-001C'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.50.1'
          uci set network.lan.netmask='255.255.255.0'

          if [ ! -s /etc/config/wireless ]; then
            wifi config 2>/dev/null || true
          fi

          AP_SECTION=$(uci -q show wireless | sed -n "s/^\\(wireless\\.[^=]*\\)=wifi-iface$/\\1/p" | head -n 1)
          if [ -z "$AP_SECTION" ]; then
            AP_SECTION='wireless.ufi_ap'
            uci set "$AP_SECTION=wifi-iface"
          fi

          uci set "$AP_SECTION.device=radio0"
          uci set "$AP_SECTION.mode=ap"
          uci set "$AP_SECTION.network=lan"
          uci set "$AP_SECTION.ssid=__WIFI_SSID__"
          uci set "$AP_SECTION.encryption=psk2"
          uci set "$AP_SECTION.key=__WIFI_PASSWORD__"
          uci set "$AP_SECTION.disabled=0"
          uci set wireless.radio0.disabled='0' 2>/dev/null || true

          uci set uhttpd.main.listen_http='0.0.0.0:80' 2>/dev/null || true
          uci commit system
          uci commit network
          uci commit wireless
          uci commit uhttpd
          /etc/init.d/uhttpd enable 2>/dev/null || true
          printf 'root:%s\n' '__ROOT_PASSWORD__' | chpasswd
          exit 0
          EOF

          sed -i \
            -e "s/__WIFI_SSID__/$WIFI_SSID/g" \
            -e "s/__WIFI_PASSWORD__/$WIFI_PASSWORD/g" \
            -e "s/__ROOT_PASSWORD__/$ROOT_PASSWORD/g" \
            files/etc/uci-defaults/99-ufi001c-luci-only
          chmod 0755 files/etc/uci-defaults/99-ufi001c-luci-only

          cat > files/README-LUCI.txt <<EOF
          ImmortalWrt UFI-001C ${FIRMWARE_VERSION}
          Minimal image: LuCI web interface and Wi-Fi AP only.
          LuCI address: http://192.168.50.1
          Wi-Fi SSID: ${WIFI_SSID}
          Default root/LuCI password: ${ROOT_PASSWORD}
          EOF

      - name: Download package sources
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          make download -j"$(nproc)"

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -uo pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build-parallel.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            make -j1 V=s 2>&1 | tee build-single.log
            status=${PIPESTATUS[0]}
          fi
          [[ "$status" -eq 0 ]] || exit "$status"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ufi001c-luci-build-logs-${{ github.run_number }}
          if-no-files-found: ignore
          compression-level: 0
          path: openwrt/build-*.log

      - name: Verify build output
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          TARGET_DIR="bin/targets/msm89xx/msm8916"
          test -d "$TARGET_DIR"
          BOOT_IMAGE="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*-boot.img' -print -quit)"
          SYSTEM_IMAGE="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*-system.img' -print -quit)"
          [[ -n "$BOOT_IMAGE" && -n "$SYSTEM_IMAGE" ]] || {
            echo "::error::boot/system image not found"
            find "$TARGET_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          }
          find "$TARGET_DIR" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > "$TARGET_DIR/SHA256SUMS"
          cat "$TARGET_DIR/SHA256SUMS"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ufi001c-luci-minimal-${{ env.FIRMWARE_VERSION }}-${{ github.run_number }}
          if-no-files-found: error
          compression-level: 0
          path: |
            openwrt/bin/targets/msm89xx/msm8916/**
            openwrt/.config
