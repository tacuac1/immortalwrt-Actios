name: "Build ImmortalWrt UFI-001C FULL"

on:
  workflow_dispatch:
    inputs:
      custom_hash:
        description: "Optional ImmortalWrt commit hash (blank = latest master)"
        required: false
        default: ""
        type: string
      extra_packages:
        description: "Extra packages, separated by spaces or commas"
        required: false
        default: ""
        type: string

env:
  REPO_URL: "https://github.com/lkiuyu/immortalwrt"
  REPO_BRANCH: "master"
  TZ: "Asia/Shanghai"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget curl jq ninja-build \
            p7zip-full gettext-base xsltproc swig time libelf-dev \
            libdw-dev android-sdk-libsparse-utils

          sudo timedatectl set-timezone "$TZ"

      - name: Clone ImmortalWrt
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf openwrt
          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt

          if [ -n "${{ inputs.custom_hash }}" ]; then
            cd openwrt
            git fetch --depth=1 origin "${{ inputs.custom_hash }}"
            git checkout "${{ inputs.custom_hash }}"
          fi

          echo "=== Source ==="
          git -C openwrt log -1 --oneline

      - name: Update feeds
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: Fix Linux 6.18 netfilter package clash
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e

          NETFILTER="package/kernel/linux/modules/netfilter.mk"

          test -f "$NETFILTER" || {
            echo "::error::Cannot find $NETFILTER"
            exit 1
          }

          echo "=== Before netfilter fix ==="
          sed -n '45,85p' "$NETFILTER"

          # Linux 6.18/OpenWrt SNAPSHOT currently has a packaging clash:
          # kmod-iptables and kmod-nf-ipt both try to install
          # ip_tables.ko and x_tables.ko.
          #
          # Keep kmod-iptables as the logical/hidden package, but let
          # kmod-nf-ipt own the actual kernel modules.
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("package/kernel/linux/modules/netfilter.mk")
          s = p.read_text()

          marker = "define KernelPackage/iptables"
          start = s.find(marker)
          if start < 0:
              raise SystemExit("iptables package definition not found")

          end = s.find("endef", start)
          if end < 0:
              raise SystemExit("iptables package end not found")

          block = s[start:end]

          pattern = re.compile(
              r'FILES:=\s*\\\n'
              r'\s*\$\(LINUX_DIR\)/net/ipv4/netfilter/ip_tables\.ko\s*\\\n'
              r'\s*\$\(LINUX_DIR\)/net/netfilter/x_tables\.ko'
          )

          newblock, count = pattern.subn("FILES:=", block, count=1)
          if count != 1:
              raise SystemExit("Could not patch iptables FILES definition")

          p.write_text(s[:start] + newblock + s[end:])
          PY

          echo "=== After netfilter fix ==="
          sed -n '45,85p' "$NETFILTER"

          grep -A18 -B2 '^define KernelPackage/iptables' "$NETFILTER" | grep -q 'FILES:=' || {
            echo "::error::netfilter fix was not applied"
            exit 1
          }

      - name: Load UFI-001C target configuration
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          test -f "$GITHUB_WORKSPACE/config/ufi001c.config" || {
            echo "::error::config/ufi001c.config not found"
            exit 1
          }

          cp "$GITHUB_WORKSPACE/config/ufi001c.config" .config

          echo "=== UFI-001C target from config ==="
          grep -E \
            '^CONFIG_TARGET_msm89xx|^CONFIG_TARGET_PROFILE|^CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-ufi001c' \
            .config || true

      - name: Force UFI-001C FULL modem stack
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e

          enable_pkg() {
            PKG="$1"
            CFG="CONFIG_PACKAGE_${PKG}"

            if grep -q "^# ${CFG} is not set$" .config; then
              sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
            elif grep -q "^${CFG}=" .config; then
              sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
            else
              echo "${CFG}=y" >> .config
            fi
          }

          enable_default() {
            PKG="$1"
            CFG="CONFIG_DEFAULT_${PKG}"

            if grep -q "^# ${CFG} is not set$" .config; then
              sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
            elif grep -q "^${CFG}=" .config; then
              sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
            else
              echo "${CFG}=y" >> .config
            fi
          }

          # HARD target lock: this workflow is ONLY for UFI-001C.
          grep -q '^CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-ufi001c=y$' .config || {
            echo "::error::UFI-001C target is not selected"
            exit 1
          }

          # Qualcomm MSM8916 modem firmware and WLAN NV.
          enable_pkg qcom-msm8916-modem-openstick-ufi001c-firmware
          enable_pkg qcom-msm8916-openstick-ufi001c-wcnss-firmware
          enable_pkg qcom-msm8916-wcnss-openstick-ufi001c-nv

          enable_default qcom-msm8916-modem-openstick-ufi001c-firmware
          enable_default qcom-msm8916-openstick-ufi001c-wcnss-firmware
          enable_default qcom-msm8916-wcnss-openstick-ufi001c-nv

          # WWAN / QMI / ModemManager stack.
          for pkg in \
            modemmanager \
            luci-proto-modemmanager \
            qmi-utils \
            uqmi \
            usb-modeswitch \
            kmod-usb-net-qmi-wwan \
            kmod-usb-serial-option \
            kmod-usb-serial-wwan \
            kmod-bam-dmux \
            kmod-qcom-rproc-modem \
            kmod-rpmsg-wwan-ctrl
          do
            enable_pkg "$pkg" || true
          done

          # LuCI / diagnostics.
          for pkg in \
            luci \
            luci-compat \
            luci-app-ttyd \
            ttyd \
            ca-bundle \
            curl \
            wget \
            pciutils \
            usbutils
          do
            enable_pkg "$pkg" || true
          done

          # Existing UFI-001C control package if present in this builder.
          if [ -d "$GITHUB_WORKSPACE/package/ufi001c-control" ]; then
            rm -rf package/ufi001c-control
            cp -a "$GITHUB_WORKSPACE/package/ufi001c-control" package/ufi001c-control
            enable_pkg ufi001c-control
          fi

          # HomeProxy / sing-box.
          for pkg in \
            luci-app-homeproxy \
            luci-i18n-homeproxy-zh-cn \
            sing-box-tiny \
            kmod-tun \
            kmod-nft-tproxy \
            kmod-nft-socket
          do
            enable_pkg "$pkg" || true
          done

          # Extra packages from workflow input.
          RAW="${{ inputs.extra_packages }}"
          PACKAGES="$(echo "$RAW" | tr ',' ' ')"

          for pkg in $PACKAGES; do
            [ -n "$pkg" ] || continue
            case "$pkg" in
              __ip__*|__hostname__*) continue ;;
            esac
            enable_pkg "$pkg" || true
          done

          echo "=== Requested UFI-001C modem packages ==="
          grep -E \
            'qcom-msm8916-modem-openstick-ufi001c-firmware|qcom-msm8916-openstick-ufi001c-wcnss-firmware|qcom-msm8916-wcnss-openstick-ufi001c-nv|modemmanager|qmi-utils|uqmi|kmod-qcom-rproc-modem|kmod-rpmsg-wwan-ctrl' \
            .config || true

      - name: Add exact UFI-001C modem firmware payload
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e

          mkdir -p files/lib/firmware
          rm -f files/lib/firmware/openstick-ufi001c-modem.bin

          URL="https://github.com/HandsomeMod/qcom-firmware/raw/refs/heads/main/openstick-ufi001c-modem.bin"

          echo "Downloading UFI-001C modem firmware:"
          echo "$URL"

          curl -fL --retry 3 --retry-all-errors \
            "$URL" \
            -o files/lib/firmware/openstick-ufi001c-modem.bin

          test -s files/lib/firmware/openstick-ufi001c-modem.bin

          echo "=== Modem firmware SHA256 ==="
          sha256sum files/lib/firmware/openstick-ufi001c-modem.bin

          # Extract the modem firmware into the normal Linux firmware path.
          mkdir -p /tmp/ufi001c-modem
          mountpoint -q /tmp/ufi001c-modem || true

          if command -v 7z >/dev/null 2>&1; then
            7z x -y files/lib/firmware/openstick-ufi001c-modem.bin \
              -o/tmp/ufi001c-modem >/tmp/ufi001c-7z.log || true
          fi

          if [ -d /tmp/ufi001c-modem/image ]; then
            cp -av /tmp/ufi001c-modem/image/m* files/lib/firmware/ || true
            cp -av /tmp/ufi001c-modem/image/wc* files/lib/firmware/ || true
          fi

          echo "=== UFI firmware files ==="
          ls -lh files/lib/firmware | grep -E '^(.* )?(mba|modem|wcnss)' || true

      - name: Validate target and configuration
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e

          make defconfig

          grep -q '^CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-ufi001c=y$' .config
          grep -q '^CONFIG_TARGET_PROFILE="DEVICE_openstick-ufi001c"$' .config

          echo "=== FINAL TARGET ==="
          grep -E \
            '^CONFIG_TARGET_msm89xx|^CONFIG_TARGET_PROFILE|^CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-ufi001c=' \
            .config

          echo "=== FINAL MODEM CONFIG ==="
          grep -E \
            'qcom-msm8916-modem-openstick-ufi001c-firmware|qcom-msm8916-openstick-ufi001c-wcnss-firmware|qcom-msm8916-wcnss-openstick-ufi001c-nv|modemmanager|qmi-utils|uqmi|kmod-qcom-rproc-modem|kmod-rpmsg-wwan-ctrl' \
            .config || true

          echo "=== MODEM PAYLOAD ==="
          test -s files/lib/firmware/openstick-ufi001c-modem.bin
          ls -lh files/lib/firmware/openstick-ufi001c-modem.bin

      - name: Download sources
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          make download -j4 V=s
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -o pipefail

          echo "=========================================="
          echo "BUILD UFI-001C FULL"
          echo "=========================================="

          rm -f compile.log compile-j1.log

          set +e
          make -j2 V=s 2>&1 | tee compile.log
          RC=${PIPESTATUS[0]}
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "Parallel build failed: $RC"
            echo "=== Package/install errors from parallel log ==="
            grep -Ein               'check_data_file_clashes|Cannot install package|No space left|No rule to make target|recipe for target|Error [0-9]+|make\[[0-9]+\]: \*\*\*|fatal error:|undefined reference'               compile.log | tail -n 150 || true

            echo "Retrying with -j1"

            set +e
            make -j1 V=s 2>&1 | tee compile-j1.log
            RC2=${PIPESTATUS[0]}
            set -e

            echo "=== Final errors from single-job log ==="
            grep -Ein               'check_data_file_clashes|Cannot install package|No space left|No rule to make target|recipe for target|Error [0-9]+|make\[[0-9]+\]: \*\*\*|fatal error:|undefined reference'               compile-j1.log | tail -n 200 || true

            tail -n 100 compile-j1.log || true
            exit "$RC2"
          fi

      - name: Verify generated UFI-001C images
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e

          echo "=== Generated images ==="
          find bin/targets/msm89xx/msm8916 -maxdepth 2 -type f \
            \( -name '*ufi001c*' -o -name '*ext4-boot.img.gz' -o -name '*ext4-system.img.gz' \) \
            -print | sort

          echo "=== Firmware package manifest ==="
          find bin/targets/msm89xx/msm8916 -type f \
            -name '*manifest*' -o \
            -name '*packages*' | sort || true

          test -d bin/targets/msm89xx/msm8916

      - name: Prepare direct flash images
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/flash-images"

          BOOT="$(find bin/targets/msm89xx/msm8916 -type f -name '*ufi001c*ext4-boot.img.gz' | head -n 1)"
          ROOT="$(find bin/targets/msm89xx/msm8916 -type f -name '*ufi001c*ext4-system.img.gz' | head -n 1)"

          # Fallback to the standard msm8916 names if the device name is omitted.
          [ -n "$BOOT" ] || BOOT="$(find bin/targets/msm89xx/msm8916 -type f -name '*ext4-boot.img.gz' | head -n 1)"
          [ -n "$ROOT" ] || ROOT="$(find bin/targets/msm89xx/msm8916 -type f -name '*ext4-system.img.gz' | head -n 1)"

          test -n "$BOOT"
          test -n "$ROOT"

          gzip -dc "$BOOT" > "$GITHUB_WORKSPACE/flash-images/boot.img"
          gzip -dc "$ROOT" > "$GITHUB_WORKSPACE/flash-images/rootfs.img"

          sha256sum \
            "$GITHUB_WORKSPACE/flash-images/boot.img" \
            "$GITHUB_WORKSPACE/flash-images/rootfs.img"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UFI001C-FULL-FIRMWARE
          path: |
            openwrt/bin/targets/msm89xx/msm8916/**
            flash-images/boot.img
            flash-images/rootfs.img
            openwrt/compile.log
            openwrt/compile-j1.log
          if-no-files-found: warn
          compression-level: 6
